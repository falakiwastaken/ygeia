<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ygeia — domain tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         background:#0B0D10; color:#E8EDF2; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8A94A3; margin-bottom:20px; font-size:13px; }
  .summary { padding:12px 16px; border-radius:10px; margin-bottom:18px; font-weight:700; }
  .ok  { background:#0F2E24; color:#22D3A6; border:1px solid #22D3A6; }
  .bad { background:#33131C; color:#FF5C7A; border:1px solid #FF5C7A; }
  .group { color:#4DA3FF; margin:18px 0 6px; font-weight:700; }
  .case { padding:3px 0; border-bottom:1px solid #1C222A; display:flex; gap:10px; }
  .tag { flex:0 0 46px; font-weight:700; }
  .pass .tag { color:#22D3A6; }
  .fail .tag { color:#FF5C7A; }
  .fail { background:#2A1219; }
  .name { flex:1; }
  .nums { color:#67707C; }
</style>
</head>
<body>
<h1>Ygeia — domain tests</h1>
<div class="sub">
  Pure-function tests for <code>js/domain.js</code>. No test runner, no dependencies —
  open this file in a browser. Reference values are computed by hand from the published
  formulas, not from the implementation.
</div>
<div id="out"></div>

<script src="js/util.js"></script>
<script src="js/domain.js"></script>
<script src="js/domain-life.js"></script>
<script src="js/domain-cut.js"></script>
<script src="js/domain-study.js"></script>
<script src="js/domain-rank.js"></script>
<script src="js/domain-plan.js"></script>
<script src="js/domain-insights.js"></script>
<script src="js/map.js"></script>
<script src="js/data-foods.js"></script>
<script src="js/data-exercises.js"></script>
<script src="js/data-meals.js"></script>
<script src="js/data-programs.js"></script>
<script>
(function () {
  'use strict';
  const D = V.domain;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;

  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 0.01 : tol);

  function group(name) {
    out.appendChild(Object.assign(document.createElement('div'), { className: 'group', textContent: name }));
  }

  function t(name, got, want, tol) {
    const ok = near(Number(got), Number(want), tol);
    ok ? pass++ : fail++;
    const row = document.createElement('div');
    row.className = 'case ' + (ok ? 'pass' : 'fail');
    row.innerHTML =
      '<span class="tag">' + (ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="name">' + name + '</span>' +
      '<span class="nums">' + (+Number(got).toFixed(4)) + ' / ' + (+Number(want).toFixed(4)) + '</span>';
    out.appendChild(row);
  }

  // =====================================================================
  group('Mifflin-St Jeor BMR / TDEE');
  // Worked by hand: 10*80 + 6.25*180 - 5*30 + 5 = 800 + 1125 - 150 + 5
  t('BMR male 80kg 180cm 30y = 1780', D.bmr({ sex: 'male', weightKg: 80, heightCm: 180, age: 30 }), 1780);
  t('BMR female same stats = 1614', D.bmr({ sex: 'female', weightKg: 80, heightCm: 180, age: 30 }), 1614);
  t('BMR unspecified = midpoint 1697', D.bmr({ sex: 'unspecified', weightKg: 80, heightCm: 180, age: 30 }), 1697);
  t('TDEE moderate = BMR x 1.55',
    D.tdee({ sex: 'male', weightKg: 80, heightCm: 180, age: 30, activityLevel: 'moderate' }), 1780 * 1.55);

  const lean = { sex: 'female', weightKg: 50, heightCm: 160, age: 25, activityLevel: 'sedentary', goal: 'cut' };
  t('cut target never dips below BMR', D.calorieTarget(lean) >= D.bmr(lean) ? 1 : 0, 1);

  // =====================================================================
  group('Macro targets');
  const prof = { sex: 'male', weightKg: 80, heightCm: 180, age: 30, activityLevel: 'moderate', goal: 'maintain', proteinPerKg: 1.8 };
  const tg = D.macroTargets(prof);
  t('protein = 1.8 g/kg x 80kg', tg.protein, 144);
  t('macros reconstruct calorie target', tg.protein * 4 + tg.carbs * 4 + tg.fat * 9, tg.kcal, 5);
  t('4/4/9 kcal per gram', D.kcalFromMacros({ protein: 50, carbs: 100, fat: 20 }), 50 * 4 + 100 * 4 + 20 * 9);
  t('fat floored at 0.6 g/kg',
    D.macroTargets({ sex: 'male', weightKg: 100, heightCm: 180, age: 30, activityLevel: 'sedentary', goal: 'cut', proteinPerKg: 2.2 }).fat >= 60 ? 1 : 0, 1);

  // =====================================================================
  group('Energy balance (7700 kcal/kg)');
  // cut @80kg targets -0.6 kg/wk. Losing 1.0 => 0.4 too fast => +440/day, capped to +300.
  t('losing too fast -> capped +300', D.suggestCalorieAdjustment('cut', -1.0, 80), 300);
  t('within deadband -> no change', D.suggestCalorieAdjustment('cut', -0.65, 80), 0);
  t('maintaining but gaining -> -225', D.suggestCalorieAdjustment('maintain', 0.2, 80), -225);
  t('direction: too slow -> eat less', D.suggestCalorieAdjustment('cut', -0.2, 80) < 0 ? 1 : 0, 1);

  // =====================================================================
  group('One-rep max');
  t('1 rep returns the weight itself', D.estimate1RM(100, 1), 100);
  // Brzycki 100*36/32 = 112.5; Epley 100*(1+5/30) = 116.667; blend weight (5-2)/20 = 0.15
  t('100kg x5 blended = 113.125', D.estimate1RM(100, 5), 112.5 * 0.85 + (100 * (1 + 5 / 30)) * 0.15);
  t('reps capped at 12', D.estimate1RM(100, 20), D.estimate1RM(100, 12));
  t('weightForReps inverts Brzycki', D.weightForReps(100, 10), 100 * (37 - 10) / 36);
  t('zero reps -> 0', D.estimate1RM(100, 0), 0);

  // =====================================================================
  group('Volume and PRs');
  const sets = [
    { id: 'w', completed: true, type: 'warmup', weightKg: 60, reps: 10 },
    { id: 'a', completed: true, type: 'working', weightKg: 100, reps: 5 },
    { id: 'b', completed: false, type: 'working', weightKg: 100, reps: 5 },
  ];
  t('volume excludes warmups and incompletes', D.volume(sets), 500);
  const hist = [{ id: 'a', completed: true, type: 'working', weightKg: 100, reps: 5 }];
  t('heavier set is a PR', D.isPR({ id: 'b', completed: true, type: 'working', weightKg: 110, reps: 5 }, hist) ? 1 : 0, 1);
  t('lighter set is not', D.isPR({ id: 'c', completed: true, type: 'working', weightKg: 90, reps: 5 }, hist) ? 1 : 0, 0);
  t('warmup never a PR', D.isPR({ id: 'd', completed: true, type: 'warmup', weightKg: 200, reps: 5 }, hist) ? 1 : 0, 0);
  t('incomplete never a PR', D.isPR({ id: 'e', completed: false, type: 'working', weightKg: 200, reps: 5 }, hist) ? 1 : 0, 0);

  // =====================================================================
  group('Double progression');
  const maxed = [
    { completed: true, type: 'working', weightKg: 100, reps: 10 },
    { completed: true, type: 'working', weightKg: 100, reps: 10 },
  ];
  t('lower body adds 5kg', D.suggestProgression(maxed, { isLowerBody: true }, { min: 6, max: 10 }).weightKg, 105);
  t('upper body adds 2.5kg', D.suggestProgression(maxed, { isLowerBody: false }, { min: 6, max: 10 }).weightKg, 102.5);
  t('resets to bottom of rep range', D.suggestProgression(maxed, { isLowerBody: true }, { min: 6, max: 10 }).reps, 6);
  t('not yet maxed -> add one rep',
    D.suggestProgression([{ completed: true, type: 'working', weightKg: 100, reps: 7 }], { isLowerBody: false }, { min: 6, max: 10 }).reps, 8);
  t('RPE 9.5 blocks the load increase',
    D.suggestProgression([{ completed: true, type: 'working', weightKg: 100, reps: 10, rpe: 9.5 }], { isLowerBody: false }, { min: 6, max: 10 }).weightKg, 100);
  t('missing RPE does not block', D.suggestProgression(maxed, { isLowerBody: false }, { min: 6, max: 10 }).action === 'increase_weight' ? 1 : 0, 1);

  // =====================================================================
  group('Plate calculator');
  const p1 = D.platesPerSide(100, 20, [25, 20, 15, 10, 5, 2.5, 1.25]);
  t('100kg -> 40kg per side', p1.perSide, 40);
  t('100kg -> 25 + 15', p1.plates.join('+') === '25+15' ? 1 : 0, 1);
  t('100kg fully loadable', p1.remainderKg, 0);
  // (61-20)/2 = 20.5; largest usable plate is 20, so 0.5 is unreachable.
  const p2 = D.platesPerSide(61, 20, [25, 20, 15, 10, 5, 2.5, 1.25]);
  t('61kg leaves 0.5kg per side', p2.remainderKg, 0.5);
  t('61kg closest loadable = 60kg', 61 - p2.remainderKg * 2, 60);
  t('empty bar needs no plates', D.platesPerSide(20, 20, [25]).plates.length, 0);
  t('below bar weight is handled', D.platesPerSide(10, 20, [25]).perSide, 0);

  // =====================================================================
  group('Nutrition score');
  const mk = (kcal, protein, extra, nova, hour) => ({
    loggedAt: new Date(2026, 0, 1, hour == null ? 12 : hour).getTime(),
    food: { novaGroup: nova },
    nutrients: Object.assign({ kcal, protein, carbs: 0, fat: 0 }, extra || {}),
  });
  const targets = { kcal: 2000, protein: 100, carbs: 200, fat: 60 };
  const st = { lateMealHour: 21, lateMealMinKcal: 150 };

  const bare = D.nutritionScore([mk(2000, 100)], targets, st);
  t('bare macros score only what is known', bare.components.length, 2);
  t('protein at target = 100', bare.components.find((c) => c.key === 'protein').value, 100);
  t('weights renormalise to 100', bare.score, 100);
  t('unknown fibre is not scored as zero', bare.components.some((c) => c.key === 'fiber') ? 1 : 0, 0);

  const half = D.nutritionScore([mk(2000, 50)], targets, st);
  t('half protein scores 50', half.components.find((c) => c.key === 'protein').value, 50);
  t('renormalised blend (50*20 + 100*10)/30', half.score, Math.round((50 * 20 + 100 * 10) / 30));

  const fib = D.nutritionScore([mk(2000, 100, { fiber: 28 })], targets, st);
  t('fibre 28g at 2000kcal hits target', fib.components.find((c) => c.key === 'fiber').value, 100);

  t('late meal under kcal floor is ignored', D.nutritionScore([mk(100, 10, null, 1, 22)], targets, st).isLateMeal ? 1 : 0, 0);
  t('late meal over kcal floor is flagged', D.nutritionScore([mk(600, 10, null, 1, 22)], targets, st).isLateMeal ? 1 : 0, 1);

  t('whole-food 50/50 split = 50',
    D.nutritionScore([mk(1000, 50, null, 1), mk(1000, 50, null, 4)], targets, st).components.find((c) => c.key === 'whole').value, 50);
  t('NOVA known for <50% of kcal -> dropped',
    D.nutritionScore([mk(1800, 50), mk(200, 5, null, 1)], targets, st).components.some((c) => c.key === 'whole') ? 1 : 0, 0);
  t('empty day scores null', D.nutritionScore([], targets, st).score === null ? 1 : 0, 1);

  // =====================================================================
  group('Nutrient scaling');
  const sc = D.scaleNutrients({ kcal: 100, protein: 10, fiber: null }, 250);
  t('scales linearly to portion', sc.kcal, 250);
  t('null stays absent (unknown != zero)', ('fiber' in sc) ? 1 : 0, 0);
  t('explicit zero is preserved', D.scaleNutrients({ kcal: 100, fiber: 0 }, 100).fiber, 0);
  t('sumNutrients adds present fields', D.sumNutrients([{ kcal: 100 }, { kcal: 50, fiber: 3 }]).kcal, 150);

  // =====================================================================
  group('Regression and trends');
  const fit = D.linearRegression([{ x: 0, y: 3 }, { x: 1, y: 5 }, { x: 2, y: 7 }, { x: 3, y: 9 }]);
  t('slope of y = 2x + 3', fit.slope, 2);
  t('intercept of y = 2x + 3', fit.intercept, 3);
  t('r2 of a perfect fit', fit.r2, 1);
  t('single point cannot be fitted', D.linearRegression([{ x: 1, y: 1 }]) === null ? 1 : 0, 1);
  t('zero x-variance cannot be fitted',
    D.linearRegression([{ x: 1, y: 1 }, { x: 1, y: 2 }]) === null ? 1 : 0, 1);

  const clean = [];
  for (let i = 0; i < 10; i++) clean.push({ date: V.addDays('2026-01-01', i), value: 80 - i * 0.1 });
  t('-0.1 kg/day = -0.7 kg/week', D.trend(clean, 30).perWeek, -0.7);
  t('clean trend is reliable', D.trend(clean, 30).reliable ? 1 : 0, 1);
  t('projection has 30 points', D.trend(clean, 30).projection.length, 30);

  const noisy = [];
  for (let i = 0; i < 10; i++) noisy.push({ date: V.addDays('2026-01-01', i), value: 80 + (i % 2 ? 2 : -2) });
  t('noise is flagged unreliable', D.trend(noisy, 30).reliable ? 1 : 0, 0);

  // =====================================================================
  group('Streaks');
  const today = V.today();
  t('three consecutive days', D.streak([today, V.addDays(today, -1), V.addDays(today, -2)]), 3);
  t('a gap breaks the streak', D.streak([today, V.addDays(today, -2)]), 1);
  t('yesterday still counts (today not logged yet)', D.streak([V.addDays(today, -1)]), 1);
  t('stale data scores zero', D.streak([V.addDays(today, -5)]), 0);
  t('no data scores zero', D.streak([]), 0);

  // =====================================================================
  group('Dates and units');
  t('crosses month end', V.addDays('2026-01-31', 1) === '2026-02-01' ? 1 : 0, 1);
  t('crosses year end', V.addDays('2025-12-31', 1) === '2026-01-01' ? 1 : 0, 1);
  t('handles leap day 2028', V.addDays('2028-02-28', 1) === '2028-02-29' ? 1 : 0, 1);
  t('Jan 1 to Mar 1 2026 = 59 days', V.daysBetween('2026-01-01', '2026-03-01'), 59);
  t('DST weekend is still 2 days', V.daysBetween('2026-03-07', '2026-03-09'), 2);
  t('kg <-> lb round-trips', V.displayToKg(V.kgToDisplay(83.7, 'lb'), 'lb'), 83.7);
  t('cm <-> in round-trips', V.displayToCm(V.cmToDisplay(178, 'in'), 'in'), 178);
  t('1 lb = 0.45359237 kg', V.displayToKg(1, 'lb'), 0.45359237, 1e-9);

  // =====================================================================
  group('BMI and FFMI');
  // 80 kg at 1.80 m -> 80 / 3.24
  t('BMI 80kg / 180cm', V.life.bmi(80, 180), 80 / 3.24);
  t('BMI 24.7 is the healthy band', V.life.bmiCategory(24.7).label === 'Healthy range' ? 1 : 0, 1);
  t('BMI 26 is overweight', V.life.bmiCategory(26).label === 'Overweight' ? 1 : 0, 1);
  t('lean mass at 15% body fat', V.life.leanMass(80, 15), 68);
  t('FFMI raw = lean / height^2', V.life.ffmi(80, 180, 15).raw, 68 / 3.24);
  t('FFMI normalised is unchanged at 1.80 m', V.life.ffmi(80, 180, 15).normalised, 68 / 3.24);
  t('FFMI normalisation lifts a shorter lifter',
    V.life.ffmi(70, 165, 15).normalised > V.life.ffmi(70, 165, 15).raw ? 1 : 0, 1);
  // A muscular lifter classed "overweight" must be told to use FFMI instead.
  t('caveat fires for a lean, heavy lifter',
    /muscle, not fat/.test(V.life.bmiCaveat(26, 12)) ? 1 : 0, 1);

  // =====================================================================
  group('Sport energy cost');
  // kcal/min = MET x 3.5 x kg / 200
  t('7 MET, 45 min, 75 kg', V.life.sportCalories(7, 45, 75, 'moderate'), (7 * 3.5 * 75 / 200) * 45);
  t('"hard" applies a 1.25x factor',
    V.life.sportCalories(7, 45, 75, 'hard'), (7 * 1.25 * 3.5 * 75 / 200) * 45);
  t('zero duration costs nothing', V.life.sportCalories(7, 0, 75, 'moderate'), 0);
  t('MET-minutes sum', V.life.metMinutes([{ met: 7, durationMin: 30 }, { met: 10, durationMin: 60 }]), 810);
  t('below 500 MET-min misses the guideline',
    V.life.loadBand(400).label === 'Below guideline' ? 1 : 0, 1);

  // =====================================================================
  group('Weight cut safety');
  const wk = () => Date.now() + 7 * 86400000;
  const modest = V.cut.plan({ currentKg: 80, targetKg: 78, weighInAt: wk(), sex: 'male' });
  t('2 kg over a week is safe', modest.risk === 'safe' ? 1 : 0, 1);
  t('safe plan produces a schedule', modest.phases.length > 0 ? 1 : 0, 1);

  // 80 -> 66 kg in two days is 17.5% — far past where athletes have died.
  const extreme = V.cut.plan({ currentKg: 80, targetKg: 66, weighInAt: Date.now() + 2 * 86400000, sex: 'male' });
  t('extreme cut is classed unsafe', extreme.risk === 'unsafe' ? 1 : 0, 1);
  t('unsafe cut generates NO schedule', extreme.phases.length, 0);
  t('unsafe cut explains why', extreme.warnings.length >= 2 ? 1 : 0, 1);
  t('unsafe cut is marked infeasible', extreme.feasible ? 1 : 0, 0);

  t('already on weight needs no cut',
    V.cut.plan({ currentKg: 70, targetKg: 70, weighInAt: wk(), sex: 'male' }).risk === 'none' ? 1 : 0, 1);
  t('a past weigh-in is rejected',
    V.cut.plan({ currentKg: 80, targetKg: 78, weighInAt: Date.now() - 86400000, sex: 'male' }).feasible ? 1 : 0, 0);

  // Rehydration: 150% of the fluid deficit.
  const rehy = V.cut.rehydration(2, 24, 78);
  t('rehydrate 150% of loss', rehy.fluidL, 3);
  t('24h turnaround allows full rehydration', rehy.complete ? 1 : 0, 1);
  t('4h turnaround does not', V.cut.rehydration(2, 4, 78).complete ? 1 : 0, 0);
  t('acute cap is 8% of bodyweight', V.cut.ACUTE_MAX_PCT, 0.08);

  // =====================================================================
  group('Sleep');
  t('parse 07:30', V.study.parseTime('07:30'), 450);
  t('reject 25:00', V.study.parseTime('25:00') === null ? 1 : 0, 1);
  t('format 450 -> 07:30', V.study.formatTime(450) === '07:30' ? 1 : 0, 1);
  t('formatting wraps past midnight', V.study.formatTime(-60) === '23:00' ? 1 : 0, 1);
  t('23:00 to 07:00 is 8 hours', V.study.duration(V.study.parseTime('23:00'), V.study.parseTime('07:00')), 8);
  t('01:00 to 09:00 is 8 hours', V.study.duration(60, 540), 8);
  // 6 cycles = 9h, plus 15 min to fall asleep, back from 07:00 -> 21:45
  t('6 cycles before a 07:00 wake = 21:45',
    V.study.bedtimesFor(V.study.parseTime('07:00'))[0].bedtime === '21:45' ? 1 : 0, 1);
  t('4 cycles is flagged as short',
    V.study.bedtimesFor(420).find((b) => b.cycles === 4).adequate ? 1 : 0, 0);
  t('sleep debt counts only shortfalls',
    V.study.sleepDebt([{ date: V.today(), hours: 6 }, { date: V.addDays(V.today(), -1), hours: 10 }], 8), 2);

  // =====================================================================
  group('Spaced repetition');
  const card = V.study.newReviewItem('s1', 'test');
  t('new card starts in box 0', card.box, 0);
  t('new card is due in 1 day', V.daysBetween(V.today(), card.dueDate), 1);
  const passed = V.study.gradeReview(card, true);
  t('recall promotes to box 1', passed.box, 1);
  t('box 1 is due in 3 days', V.daysBetween(V.today(), passed.dueDate), 3);
  const box3 = V.study.gradeReview(V.study.gradeReview(passed, true), true);
  t('three passes reach box 3', box3.box, 3);
  t('box 3 is due in 16 days', V.daysBetween(V.today(), box3.dueDate), 16);
  t('forgetting resets to box 0', V.study.gradeReview(box3, false).box, 0);
  t('a lapse is recorded', V.study.gradeReview(box3, false).lapses, 1);
  t('only due cards are returned',
    V.study.dueItems([{ dueDate: V.today() }, { dueDate: V.addDays(V.today(), 5) }]).length, 1);
  t('re-reading is discounted vs recall',
    V.study.effectiveMinutes([{ minutes: 60, technique: 'reading' }]) <
    V.study.effectiveMinutes([{ minutes: 60, technique: 'recall' }]) ? 1 : 0, 1);

  // =====================================================================
  group('Strength rank');
  // 80 kg male: squat standards are 0.75 / 1.25 / 1.75 / 2.5 / 3.0 x bodyweight,
  // scoring 200 / 400 / 600 / 800 / 1000 at those exact thresholds.
  t('0.75x bodyweight = 200 (beginner)', V.rank.liftScore('ex-back-squat', 60, 80, 'male'), 200);
  t('1.25x = 400 (novice)', V.rank.liftScore('ex-back-squat', 100, 80, 'male'), 400);
  t('1.75x = 600 (intermediate)', V.rank.liftScore('ex-back-squat', 140, 80, 'male'), 600);
  t('2.5x = 800 (advanced)', V.rank.liftScore('ex-back-squat', 200, 80, 'male'), 800);
  t('3.0x = 1000 (elite)', V.rank.liftScore('ex-back-squat', 240, 80, 'male'), 1000);
  // 120 kg is 1.5x bodyweight — halfway between novice (1.25x = 400) and
  // intermediate (1.75x = 600), so it interpolates to 500.
  t('midpoint interpolates', V.rank.liftScore('ex-back-squat', 120, 80, 'male'), 500);
  t('deadlift 2.0x = 600', V.rank.liftScore('ex-deadlift', 160, 80, 'male'), 600);
  t('female standards scale by 0.72',
    V.rank.liftScore('ex-back-squat', 140 * 0.72, 80, 'female'), 600);
  t('unrated exercise returns null',
    V.rank.liftScore('ex-lateral-raise', 20, 80, 'male') === null ? 1 : 0, 1);

  t('one lift is capped by the breadth penalty', V.rank.overall([{ score: 800 }]), Math.round(800 * 0.82));
  t('three lifts score in full', V.rank.overall([{ score: 800 }, { score: 800 }, { score: 800 }]), 800);
  t('only the best three count',
    V.rank.overall([{ score: 900 }, { score: 900 }, { score: 900 }, { score: 100 }]), 900);
  t('no lifts means unranked', V.rank.overall([]) === null ? 1 : 0, 1);

  // Tiers are pinned to the strength standards: Adept = intermediate (600),
  // Master = advanced (860), Legend = elite (1000) across the best three lifts.
  t('rating 0 is Novice', V.rank.tierFor(0).name === 'Novice' ? 1 : 0, 1);
  t('intermediate (600) is Adept', V.rank.tierFor(600).name === 'Adept' ? 1 : 0, 1);
  t('995 is Grandmaster, not Legend', V.rank.tierFor(995).name === 'Grandmaster' ? 1 : 0, 1);
  t('Legend requires elite (1000)', V.rank.tierFor(1000).name === 'Legend' ? 1 : 0, 1);
  t('tiers ascend monotonically',
    V.rank.TIERS.every((x, i, a) => i === 0 || x.min > a[i - 1].min) ? 1 : 0, 1);
  t('progress reports points to next rank', V.rank.progress(200).pointsToNext, 50);
  t('XP level rises with XP', V.rank.levelFor(5000).level > V.rank.levelFor(500).level ? 1 : 0, 1);
  t('zero XP is level 1', V.rank.levelFor(0).level, 1);

  // =====================================================================
  group('XP weighting (load over volume)');
  const BW = 80;
  // Sets taken at 85% of the 1RM implied by each standard, for 4 reps.
  const setAt = (mult) => {
    const oneRM = mult * BW;
    return { completed: true, type: 'working', weightKg: oneRM * 0.85, reps: 4 };
  };
  const xpAt = (mult) => V.rank.setXp(setAt(mult), 'ex-back-squat', BW, 'male');

  t('a warmup earns nothing',
    V.rank.setXp({ completed: true, type: 'warmup', weightKg: 200, reps: 5 }, 'ex-back-squat', BW, 'male'), 0);
  t('an uncompleted set earns nothing',
    V.rank.setXp({ completed: false, type: 'working', weightKg: 200, reps: 5 }, 'ex-back-squat', BW, 'male'), 0);
  t('flat rate is small', V.rank.XP.perWorkingSet, 2);
  t('unrated lifts earn only the flat rate',
    V.rank.setXp(setAt(1.75), 'ex-lateral-raise', BW, 'male'), V.rank.XP.perWorkingSet);

  t('heavier sets earn strictly more', xpAt(2.5) > xpAt(1.75) ? 1 : 0, 1);
  t('and more again at elite', xpAt(3.0) > xpAt(2.5) ? 1 : 0, 1);
  // The whole point of the rebalance: load must dominate volume.
  t('one elite set beats four beginner sets', xpAt(3.0) > 4 * xpAt(0.75) ? 1 : 0, 1);
  t('elite set is worth 5x+ a beginner set', xpAt(3.0) / xpAt(0.75) >= 5 ? 1 : 0, 1);
  t('a PR is worth more than any single set', V.rank.XP.perPR > xpAt(3.0) ? 1 : 0, 1);

  // Twenty easy sets vs five heavy ones — the behaviour being discouraged.
  t('20 easy sets do not out-earn 5 heavy ones',
    20 * xpAt(0.75) < 5 * xpAt(2.5) ? 1 : 0, 1);

  // =====================================================================
  group('Map projection');
  // At zoom 0 the world is one 256px tile, so (0,0) lands dead centre.
  t('origin at zoom 0 is x=128', V.map.project(0, 0, 0).x, 128);
  t('origin at zoom 0 is y=128', V.map.project(0, 0, 0).y, 128);
  t('project/unproject round-trips (lat)', V.map.unproject(V.map.project(51.5, -0.12, 15).x, V.map.project(51.5, -0.12, 15).y, 15).lat, 51.5, 0.0001);
  t('project/unproject round-trips (lon)', V.map.unproject(V.map.project(51.5, -0.12, 15).x, V.map.project(51.5, -0.12, 15).y, 15).lon, -0.12, 0.0001);
  t('London to Paris is ~344 km', V.map.distance(51.5074, -0.1278, 48.8566, 2.3522) / 1000, 344, 2);
  t('a point is zero distance from itself', V.map.distance(51.5, -0.12, 51.5, -0.12), 0);

  // =====================================================================
  group('Content integrity');
  // Every id referenced by a meal or program must exist in the seed libraries.
  // A typo here silently breaks a feature at runtime — exactly how 'ex-farmers-walk'
  // (the real slug is 'ex-farmer-s-walk') got shipped once.
  const seedFoodIds = new Set(V.seedFoods().map((f) => f.id));
  const seedExIds = new Set(V.seedExercises().map((e) => e.id));

  const badIngredients = [];
  for (const m of V.MEALS) {
    for (const ing of m.ingredients) {
      if (!seedFoodIds.has(ing.foodId)) badIngredients.push(m.name + ' → ' + ing.foodId);
    }
  }
  t('every meal ingredient resolves', badIngredients.length, 0);
  if (badIngredients.length) {
    out.appendChild(Object.assign(document.createElement('div'),
      { className: 'case fail', textContent: badIngredients.join(' | ') }));
  }

  const badExercises = [];
  for (const p of V.PROGRAMS) {
    for (const d of p.days) {
      for (const s of d.exercises) {
        if (!seedExIds.has(s.exerciseId)) badExercises.push(p.name + '/' + d.name + ' → ' + s.exerciseId);
      }
    }
  }
  t('every program exercise resolves', badExercises.length, 0);
  if (badExercises.length) {
    out.appendChild(Object.assign(document.createElement('div'),
      { className: 'case fail', textContent: badExercises.join(' | ') }));
  }

  t('no duplicate food ids', seedFoodIds.size, V.seedFoods().length);
  t('no duplicate exercise ids', seedExIds.size, V.seedExercises().length);
  t('every meal has at least one step', V.MEALS.every((m) => m.steps.length > 0) ? 1 : 0, 1);
  t('every program has days', V.PROGRAMS.every((p) => p.days.length > 0) ? 1 : 0, 1);
  t('rep ranges are sane',
    V.PROGRAMS.every((p) => p.days.every((d) => d.exercises.every((e) => e.repMin <= e.repMax))) ? 1 : 0, 1);

  // =====================================================================
  group('Check-in and habits');
  // energy 4, soreness 2 (inverse -> 4), mood 4, motivation 5 => mean 4.25 => 81
  t('readiness from morning answers',
    V.plan.readiness({ morning: { energy: 4, soreness: 2, mood: 4, motivation: 5 } }), 81);
  t('soreness is inverted (5 = worst)',
    V.plan.readiness({ morning: { soreness: 5 } }), 0);
  t('no morning check-in = no readiness',
    V.plan.readiness({ evening: { focus: 3 } }) === null ? 1 : 0, 1);
  t('all top marks = 100',
    V.plan.readiness({ morning: { energy: 5, soreness: 1, mood: 5, motivation: 5 } }), 100);

  // =====================================================================
  group('Meal planning');
  const foodMap = {};
  for (const f of V.seedFoods()) foodMap[f.id] = f;
  const testMeal = V.MEALS.find((m) => m.id === 'meal-chicken-rice-broccoli');
  const mealNut = V.plan.mealNutrients(testMeal, foodMap);
  // 170g cooked chicken (165 kcal/100g) = 280.5, plus rice/broccoli/oil
  t('meal nutrients are computed, not hard-coded', mealNut.kcal > 400 && mealNut.kcal < 900 ? 1 : 0, 1);
  t('meal protein is substantial', mealNut.protein > 50 ? 1 : 0, 1);

  const shopping = V.plan.shoppingList([{ meal: testMeal, servings: 4 }], foodMap);
  t('shopping list has one row per ingredient', shopping.length, testMeal.ingredients.length);
  // 170 g x 4 servings = 680 g, rounded up to the next 50 g.
  // Compared as a string, so it goes through a boolean rather than the numeric helper.
  t('quantities round up to buyable amounts',
    shopping.find((i) => /Chicken breast, cooked/.test(i.name)).display === '700 g' ? 1 : 0, 1);
  t('duplicate ingredients across meals are merged',
    V.plan.shoppingList([{ meal: testMeal, servings: 1 }, { meal: testMeal, servings: 1 }], foodMap).length,
    testMeal.ingredients.length);
  t('time filter excludes slow meals',
    V.plan.filterMeals(V.MEALS, { maxMinutes: 10 }).every((m) => m.timeMin <= 10) ? 1 : 0, 1);

  // =====================================================================
  group('Insights statistics');
  const perfect = [];
  const doubled = [];
  for (let i = 0; i < 12; i++) {
    const d = V.addDays('2026-01-01', i);
    perfect.push({ date: d, value: i });
    doubled.push({ date: d, value: i * 2 });
  }
  t('perfect positive correlation', V.insights.correlate(perfect, doubled, 0).r, 1);

  const inverted = perfect.map((p) => ({ date: p.date, value: -p.value }));
  t('perfect negative correlation', V.insights.correlate(perfect, inverted, 0).r, -1);

  t('constant series has no correlation',
    V.insights.correlate(perfect, perfect.map((p) => ({ date: p.date, value: 5 })), 0) === null ? 1 : 0, 1);

  t('12 paired days is reportable', V.insights.correlate(perfect, doubled, 0).reportable ? 1 : 0, 1);
  t('5 paired days is NOT reportable',
    V.insights.correlate(perfect.slice(0, 5), doubled.slice(0, 5), 0).reportable ? 1 : 0, 0);

  // Lag 1 shifts series A forward a day, so a same-day-only relationship weakens.
  t('lag shifts the alignment',
    V.insights.align(perfect, doubled, 1).length, 11);
  t('lag 0 aligns every day', V.insights.align(perfect, doubled, 0).length, 12);

  t('strength labels: 0.8 is strong', V.insights.strength(0.8) === 'strong' ? 1 : 0, 1);
  t('strength labels: 0.2 is negligible', V.insights.strength(0.2) === 'negligible' ? 1 : 0, 1);
  t('p-value shrinks as r grows',
    V.insights.pValue(0.9, 20) < V.insights.pValue(0.3, 20) ? 1 : 0, 1);
  t('only curated questions are tested', V.insights.QUESTIONS.length < 20 ? 1 : 0, 1);

  // =====================================================================
  group('Program sessions');
  const exMap = {};
  for (const e of V.seedExercises()) exMap[e.id] = e;
  const prog = V.PROGRAMS[0];
  t('rotation starts at day 0', V.plan.nextSession(prog, 0).index, 0);
  t('rotation wraps around', V.plan.nextSession(prog, prog.days.length).index, 0);
  t('rotation advances', V.plan.nextSession(prog, 1).index, 1);
  const session = V.plan.buildSession(prog.days[0], {}, exMap);
  t('session builds every slot', session.length, prog.days[0].exercises.length);
  t('every slot resolves an exercise', session.every((s) => s.exercise) ? 1 : 0, 1);
  t('untrained lifts start at the bottom of the range', session[0].reps, prog.days[0].exercises[0].repMin);
  t('adherence caps at 100%',
    V.plan.programAdherence(prog, Date.now() - 7 * 86400000, 99).pct, 100);

  // =====================================================================
  const summary = document.createElement('div');
  summary.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
  summary.textContent = fail === 0
    ? `All ${pass} assertions passed.`
    : `${fail} of ${pass + fail} assertions FAILED.`;
  out.insertBefore(summary, out.firstChild);
})();
</script>
</body>
</html>
