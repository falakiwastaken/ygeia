<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Ygeia — domain tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         background:#0B0D10; color:#E8EDF2; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8A94A3; margin-bottom:20px; font-size:13px; }
  .summary { padding:12px 16px; border-radius:10px; margin-bottom:18px; font-weight:700; }
  .ok  { background:#0F2E24; color:#22D3A6; border:1px solid #22D3A6; }
  .bad { background:#33131C; color:#FF5C7A; border:1px solid #FF5C7A; }
  .group { color:#4DA3FF; margin:18px 0 6px; font-weight:700; }
  .case { padding:3px 0; border-bottom:1px solid #1C222A; display:flex; gap:10px; }
  .tag { flex:0 0 46px; font-weight:700; }
  .pass .tag { color:#22D3A6; }
  .fail .tag { color:#FF5C7A; }
  .fail { background:#2A1219; }
  .name { flex:1; }
  .nums { color:#67707C; }
</style>

<body>
<h1>Ygeia — domain tests</h1>
<div class="sub">
  Pure-function tests for <code>js/domain.js</code>. No test runner, no dependencies —
  open this file in a browser. Reference values are computed by hand from the published
  formulas, not from the implementation.
</div>
<div id="out"></div>

<script src="js/util.js?v=38"></script>
<script src="js/domain.js?v=38"></script>
<script src="js/domain-life.js?v=38"></script>
<script src="js/domain-cut.js?v=38"></script>
<script src="js/domain-study.js?v=38"></script>
<script src="js/domain-rank.js?v=38"></script>
<script src="js/domain-plan.js?v=38"></script>
<script src="js/domain-insights.js?v=38"></script>
<script src="js/domain-timeline.js?v=38"></script>
<script src="js/domain-gaps.js?v=38"></script>
<script src="js/domain-vitals.js?v=38"></script>
<script src="js/domain-sound.js?v=38"></script>
<script src="js/domain-load.js?v=38"></script>
<script src="js/domain-notebook.js?v=38"></script>
<script src="js/domain-features.js?v=38"></script>
<script src="js/data-daily.js?v=38"></script>
<script src="js/ai-prompt.js?v=38"></script>
<script src="js/ai-providers.js?v=38"></script>
<script src="js/ai-vision.js?v=38"></script>
<script src="js/map.js?v=38"></script>
<script src="js/data-foods.js?v=38"></script>
<script src="js/data-exercises.js?v=38"></script>
<script src="js/food-parser.js?v=38"></script>
<script src="js/data-meals.js?v=38"></script>
<script src="js/data-programs.js?v=38"></script>
<script src="js/backup.js?v=38"></script>
<script>
(async function () {
  'use strict';
  const D = V.domain;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;

  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 0.01 : tol);

  function group(name) {
    out.appendChild(Object.assign(document.createElement('div'), { className: 'group', textContent: name }));
  }

  function t(name, got, want, tol) {
    const ok = near(Number(got), Number(want), tol);
    ok ? pass++ : fail++;
    const row = document.createElement('div');
    row.className = 'case ' + (ok ? 'pass' : 'fail');
    row.innerHTML =
      '<span class="tag">' + (ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="name">' + name + '</span>' +
      '<span class="nums">' + (+Number(got).toFixed(4)) + ' / ' + (+Number(want).toFixed(4)) + '</span>';
    out.appendChild(row);
  }

  // =====================================================================
  group('Mifflin-St Jeor BMR / TDEE');
  // Worked by hand: 10*80 + 6.25*180 - 5*30 + 5 = 800 + 1125 - 150 + 5
  t('BMR male 80kg 180cm 30y = 1780', D.bmr({ sex: 'male', weightKg: 80, heightCm: 180, age: 30 }), 1780);
  t('BMR female same stats = 1614', D.bmr({ sex: 'female', weightKg: 80, heightCm: 180, age: 30 }), 1614);
  t('BMR unspecified = midpoint 1697', D.bmr({ sex: 'unspecified', weightKg: 80, heightCm: 180, age: 30 }), 1697);
  t('TDEE moderate = BMR x 1.55',
    D.tdee({ sex: 'male', weightKg: 80, heightCm: 180, age: 30, activityLevel: 'moderate' }), 1780 * 1.55);

  const lean = { sex: 'female', weightKg: 50, heightCm: 160, age: 25, activityLevel: 'sedentary', goal: 'cut' };
  t('cut target never dips below BMR', D.calorieTarget(lean) >= D.bmr(lean) ? 1 : 0, 1);

  // =====================================================================
  group('Macro targets');
  const prof = { sex: 'male', weightKg: 80, heightCm: 180, age: 30, activityLevel: 'moderate', goal: 'maintain' };
  const tg = D.macroTargets(prof);
  // No proteinPerKg on the profile, so the 2.2 g/kg default applies: 80 x 2.2 = 176 g.
  t('the default is 2.2 g/kg', D.DEFAULT_PROTEIN_PER_KG, 2.2);
  t('protein = 2.2 g/kg x 80kg', tg.protein, 176);
  t('an explicit per-kg value still wins',
    D.macroTargets(Object.assign({}, prof, { proteinPerKg: 1.6 })).protein, 128);
  // Grams set by hand override the calculation entirely — the only protein control left
  // in the UI now that the g/kg field is gone.
  t('a gram override beats the per-kg rule',
    D.macroTargets(Object.assign({}, prof, { proteinOverride: 150 })).protein, 150);
  t('macros reconstruct calorie target', tg.protein * 4 + tg.carbs * 4 + tg.fat * 9, tg.kcal, 5);
  t('4/4/9 kcal per gram', D.kcalFromMacros({ protein: 50, carbs: 100, fat: 20 }), 50 * 4 + 100 * 4 + 20 * 9);
  t('fat floored at 0.6 g/kg',
    D.macroTargets({ sex: 'male', weightKg: 100, heightCm: 180, age: 30, activityLevel: 'sedentary', goal: 'cut', proteinPerKg: 2.2 }).fat >= 60 ? 1 : 0, 1);

  // =====================================================================
  group('Energy balance (7700 kcal/kg)');
  // cut @80kg targets -0.6 kg/wk. Losing 1.0 => 0.4 too fast => +440/day, capped to +300.
  t('losing too fast -> capped +300', D.suggestCalorieAdjustment('cut', -1.0, 80), 300);
  t('within deadband -> no change', D.suggestCalorieAdjustment('cut', -0.65, 80), 0);
  t('maintaining but gaining -> -225', D.suggestCalorieAdjustment('maintain', 0.2, 80), -225);
  t('direction: too slow -> eat less', D.suggestCalorieAdjustment('cut', -0.2, 80) < 0 ? 1 : 0, 1);

  // =====================================================================
  group('One-rep max');
  t('1 rep returns the weight itself', D.estimate1RM(100, 1), 100);
  // Brzycki 100*36/32 = 112.5; Epley 100*(1+5/30) = 116.667; blend weight (5-2)/20 = 0.15
  t('100kg x5 blended = 113.125', D.estimate1RM(100, 5), 112.5 * 0.85 + (100 * (1 + 5 / 30)) * 0.15);
  t('reps capped at 12', D.estimate1RM(100, 20), D.estimate1RM(100, 12));
  t('weightForReps inverts Brzycki', D.weightForReps(100, 10), 100 * (37 - 10) / 36);
  t('zero reps -> 0', D.estimate1RM(100, 0), 0);

  // =====================================================================
  group('Volume and PRs');
  const sets = [
    { id: 'w', completed: true, type: 'warmup', weightKg: 60, reps: 10 },
    { id: 'a', completed: true, type: 'working', weightKg: 100, reps: 5 },
    { id: 'b', completed: false, type: 'working', weightKg: 100, reps: 5 },
  ];
  t('volume excludes warmups and incompletes', D.volume(sets), 500);
  const hist = [{ id: 'a', completed: true, type: 'working', weightKg: 100, reps: 5 }];
  t('heavier set is a PR', D.isPR({ id: 'b', completed: true, type: 'working', weightKg: 110, reps: 5 }, hist) ? 1 : 0, 1);
  t('lighter set is not', D.isPR({ id: 'c', completed: true, type: 'working', weightKg: 90, reps: 5 }, hist) ? 1 : 0, 0);
  t('warmup never a PR', D.isPR({ id: 'd', completed: true, type: 'warmup', weightKg: 200, reps: 5 }, hist) ? 1 : 0, 0);
  t('incomplete never a PR', D.isPR({ id: 'e', completed: false, type: 'working', weightKg: 200, reps: 5 }, hist) ? 1 : 0, 0);

  // =====================================================================
  group('Double progression');
  const maxed = [
    { completed: true, type: 'working', weightKg: 100, reps: 10 },
    { completed: true, type: 'working', weightKg: 100, reps: 10 },
  ];
  t('lower body adds 5kg', D.suggestProgression(maxed, { isLowerBody: true }, { min: 6, max: 10 }).weightKg, 105);
  t('upper body adds 2.5kg', D.suggestProgression(maxed, { isLowerBody: false }, { min: 6, max: 10 }).weightKg, 102.5);
  t('resets to bottom of rep range', D.suggestProgression(maxed, { isLowerBody: true }, { min: 6, max: 10 }).reps, 6);
  t('not yet maxed -> add one rep',
    D.suggestProgression([{ completed: true, type: 'working', weightKg: 100, reps: 7 }], { isLowerBody: false }, { min: 6, max: 10 }).reps, 8);
  t('RPE 9.5 blocks the load increase',
    D.suggestProgression([{ completed: true, type: 'working', weightKg: 100, reps: 10, rpe: 9.5 }], { isLowerBody: false }, { min: 6, max: 10 }).weightKg, 100);
  t('missing RPE does not block', D.suggestProgression(maxed, { isLowerBody: false }, { min: 6, max: 10 }).action === 'increase_weight' ? 1 : 0, 1);

  // =====================================================================
  group('Plate calculator');
  const p1 = D.platesPerSide(100, 20, [25, 20, 15, 10, 5, 2.5, 1.25]);
  t('100kg -> 40kg per side', p1.perSide, 40);
  t('100kg -> 25 + 15', p1.plates.join('+') === '25+15' ? 1 : 0, 1);
  t('100kg fully loadable', p1.remainderKg, 0);
  // (61-20)/2 = 20.5; largest usable plate is 20, so 0.5 is unreachable.
  const p2 = D.platesPerSide(61, 20, [25, 20, 15, 10, 5, 2.5, 1.25]);
  t('61kg leaves 0.5kg per side', p2.remainderKg, 0.5);
  t('61kg closest loadable = 60kg', 61 - p2.remainderKg * 2, 60);
  t('empty bar needs no plates', D.platesPerSide(20, 20, [25]).plates.length, 0);
  t('below bar weight is handled', D.platesPerSide(10, 20, [25]).perSide, 0);

  // =====================================================================
  group('Nutrition score');
  const mk = (kcal, protein, extra, nova, hour) => ({
    loggedAt: new Date(2026, 0, 1, hour == null ? 12 : hour).getTime(),
    food: { novaGroup: nova },
    nutrients: Object.assign({ kcal, protein, carbs: 0, fat: 0 }, extra || {}),
  });
  const targets = { kcal: 2000, protein: 100, carbs: 200, fat: 60 };
  const st = { lateMealHour: 21, lateMealMinKcal: 150 };

  const bare = D.nutritionScore([mk(2000, 100)], targets, st);
  t('bare macros score only what is known', bare.components.length, 2);
  t('protein at target = 100', bare.components.find((c) => c.key === 'protein').value, 100);
  t('weights renormalise to 100', bare.score, 100);
  t('unknown fibre is not scored as zero', bare.components.some((c) => c.key === 'fiber') ? 1 : 0, 0);

  const half = D.nutritionScore([mk(2000, 50)], targets, st);
  t('half protein scores 50', half.components.find((c) => c.key === 'protein').value, 50);
  t('renormalised blend (50*20 + 100*10)/30', half.score, Math.round((50 * 20 + 100 * 10) / 30));

  const fib = D.nutritionScore([mk(2000, 100, { fiber: 28 })], targets, st);
  t('fibre 28g at 2000kcal hits target', fib.components.find((c) => c.key === 'fiber').value, 100);

  t('late meal under kcal floor is ignored', D.nutritionScore([mk(100, 10, null, 1, 22)], targets, st).isLateMeal ? 1 : 0, 0);
  t('late meal over kcal floor is flagged', D.nutritionScore([mk(600, 10, null, 1, 22)], targets, st).isLateMeal ? 1 : 0, 1);

  t('whole-food 50/50 split = 50',
    D.nutritionScore([mk(1000, 50, null, 1), mk(1000, 50, null, 4)], targets, st).components.find((c) => c.key === 'whole').value, 50);
  t('NOVA known for <50% of kcal -> dropped',
    D.nutritionScore([mk(1800, 50), mk(200, 5, null, 1)], targets, st).components.some((c) => c.key === 'whole') ? 1 : 0, 0);
  t('empty day scores null', D.nutritionScore([], targets, st).score === null ? 1 : 0, 1);

  // =====================================================================
  group('Nutrient scaling');
  const sc = D.scaleNutrients({ kcal: 100, protein: 10, fiber: null }, 250);
  t('scales linearly to portion', sc.kcal, 250);
  t('null stays absent (unknown != zero)', ('fiber' in sc) ? 1 : 0, 0);
  t('explicit zero is preserved', D.scaleNutrients({ kcal: 100, fiber: 0 }, 100).fiber, 0);
  t('sumNutrients adds present fields', D.sumNutrients([{ kcal: 100 }, { kcal: 50, fiber: 3 }]).kcal, 150);

  // =====================================================================
  group('Regression and trends');
  const fit = D.linearRegression([{ x: 0, y: 3 }, { x: 1, y: 5 }, { x: 2, y: 7 }, { x: 3, y: 9 }]);
  t('slope of y = 2x + 3', fit.slope, 2);
  t('intercept of y = 2x + 3', fit.intercept, 3);
  t('r2 of a perfect fit', fit.r2, 1);
  t('single point cannot be fitted', D.linearRegression([{ x: 1, y: 1 }]) === null ? 1 : 0, 1);
  t('zero x-variance cannot be fitted',
    D.linearRegression([{ x: 1, y: 1 }, { x: 1, y: 2 }]) === null ? 1 : 0, 1);

  const clean = [];
  for (let i = 0; i < 10; i++) clean.push({ date: V.addDays('2026-01-01', i), value: 80 - i * 0.1 });
  t('-0.1 kg/day = -0.7 kg/week', D.trend(clean, 30).perWeek, -0.7);
  t('clean trend is reliable', D.trend(clean, 30).reliable ? 1 : 0, 1);
  t('projection has 30 points', D.trend(clean, 30).projection.length, 30);

  const noisy = [];
  for (let i = 0; i < 10; i++) noisy.push({ date: V.addDays('2026-01-01', i), value: 80 + (i % 2 ? 2 : -2) });
  t('noise is flagged unreliable', D.trend(noisy, 30).reliable ? 1 : 0, 0);

  // =====================================================================
  group('Streaks');
  const today = V.today();
  t('three consecutive days', D.streak([today, V.addDays(today, -1), V.addDays(today, -2)]), 3);
  t('a gap breaks the streak', D.streak([today, V.addDays(today, -2)]), 1);
  t('yesterday still counts (today not logged yet)', D.streak([V.addDays(today, -1)]), 1);
  t('stale data scores zero', D.streak([V.addDays(today, -5)]), 0);
  t('no data scores zero', D.streak([]), 0);

  // =====================================================================
  group('Dates and units');
  t('crosses month end', V.addDays('2026-01-31', 1) === '2026-02-01' ? 1 : 0, 1);
  t('crosses year end', V.addDays('2025-12-31', 1) === '2026-01-01' ? 1 : 0, 1);
  t('handles leap day 2028', V.addDays('2028-02-28', 1) === '2028-02-29' ? 1 : 0, 1);
  t('Jan 1 to Mar 1 2026 = 59 days', V.daysBetween('2026-01-01', '2026-03-01'), 59);
  t('DST weekend is still 2 days', V.daysBetween('2026-03-07', '2026-03-09'), 2);
  t('kg <-> lb round-trips', V.displayToKg(V.kgToDisplay(83.7, 'lb'), 'lb'), 83.7);
  t('cm <-> in round-trips', V.displayToCm(V.cmToDisplay(178, 'in'), 'in'), 178);
  t('1 lb = 0.45359237 kg', V.displayToKg(1, 'lb'), 0.45359237, 1e-9);

  // =====================================================================
  group('BMI and FFMI');
  // 80 kg at 1.80 m -> 80 / 3.24
  t('BMI 80kg / 180cm', V.life.bmi(80, 180), 80 / 3.24);
  t('BMI 24.7 is the healthy band', V.life.bmiCategory(24.7).label === 'Healthy range' ? 1 : 0, 1);
  t('BMI 26 is overweight', V.life.bmiCategory(26).label === 'Overweight' ? 1 : 0, 1);
  t('lean mass at 15% body fat', V.life.leanMass(80, 15), 68);
  t('FFMI raw = lean / height^2', V.life.ffmi(80, 180, 15).raw, 68 / 3.24);
  t('FFMI normalised is unchanged at 1.80 m', V.life.ffmi(80, 180, 15).normalised, 68 / 3.24);
  t('FFMI normalisation lifts a shorter lifter',
    V.life.ffmi(70, 165, 15).normalised > V.life.ffmi(70, 165, 15).raw ? 1 : 0, 1);
  // A muscular lifter classed "overweight" must be told to use FFMI instead.
  t('caveat fires for a lean, heavy lifter',
    /muscle, not fat/.test(V.life.bmiCaveat(26, 12)) ? 1 : 0, 1);

  // =====================================================================
  group('Sport energy cost');
  // kcal/min = MET x 3.5 x kg / 200
  t('7 MET, 45 min, 75 kg', V.life.sportCalories(7, 45, 75, 'moderate'), (7 * 3.5 * 75 / 200) * 45);
  t('"hard" applies a 1.25x factor',
    V.life.sportCalories(7, 45, 75, 'hard'), (7 * 1.25 * 3.5 * 75 / 200) * 45);
  t('zero duration costs nothing', V.life.sportCalories(7, 0, 75, 'moderate'), 0);
  t('MET-minutes sum', V.life.metMinutes([{ met: 7, durationMin: 30 }, { met: 10, durationMin: 60 }]), 810);
  t('below 500 MET-min misses the guideline',
    V.life.loadBand(400).label === 'Below guideline' ? 1 : 0, 1);

  // =====================================================================
  group('Weight cut safety');
  const wk = () => Date.now() + 7 * 86400000;
  const modest = V.cut.plan({ currentKg: 80, targetKg: 78, weighInAt: wk(), sex: 'male' });
  t('2 kg over a week is safe', modest.risk === 'safe' ? 1 : 0, 1);
  t('safe plan produces a schedule', modest.phases.length > 0 ? 1 : 0, 1);

  // 80 -> 66 kg in two days is 17.5% — far past where athletes have died.
  const extreme = V.cut.plan({ currentKg: 80, targetKg: 66, weighInAt: Date.now() + 2 * 86400000, sex: 'male' });
  t('extreme cut is classed unsafe', extreme.risk === 'unsafe' ? 1 : 0, 1);
  t('unsafe cut generates NO schedule', extreme.phases.length, 0);
  t('unsafe cut explains why', extreme.warnings.length >= 2 ? 1 : 0, 1);
  t('unsafe cut is marked infeasible', extreme.feasible ? 1 : 0, 0);

  t('already on weight needs no cut',
    V.cut.plan({ currentKg: 70, targetKg: 70, weighInAt: wk(), sex: 'male' }).risk === 'none' ? 1 : 0, 1);
  t('a past weigh-in is rejected',
    V.cut.plan({ currentKg: 80, targetKg: 78, weighInAt: Date.now() - 86400000, sex: 'male' }).feasible ? 1 : 0, 0);

  // Rehydration: 150% of the fluid deficit.
  const rehy = V.cut.rehydration(2, 24, 78);
  t('rehydrate 150% of loss', rehy.fluidL, 3);
  t('24h turnaround allows full rehydration', rehy.complete ? 1 : 0, 1);
  t('4h turnaround does not', V.cut.rehydration(2, 4, 78).complete ? 1 : 0, 0);
  t('acute cap is 8% of bodyweight', V.cut.ACUTE_MAX_PCT, 0.08);

  // =====================================================================
  group('Sleep');
  t('parse 07:30', V.study.parseTime('07:30'), 450);
  t('reject 25:00', V.study.parseTime('25:00') === null ? 1 : 0, 1);
  t('format 450 -> 07:30', V.study.formatTime(450) === '07:30' ? 1 : 0, 1);
  t('formatting wraps past midnight', V.study.formatTime(-60) === '23:00' ? 1 : 0, 1);
  t('23:00 to 07:00 is 8 hours', V.study.duration(V.study.parseTime('23:00'), V.study.parseTime('07:00')), 8);
  t('01:00 to 09:00 is 8 hours', V.study.duration(60, 540), 8);
  // 6 cycles = 9h, plus 15 min to fall asleep, back from 07:00 -> 21:45
  t('6 cycles before a 07:00 wake = 21:45',
    V.study.bedtimesFor(V.study.parseTime('07:00'))[0].bedtime === '21:45' ? 1 : 0, 1);
  t('4 cycles is flagged as short',
    V.study.bedtimesFor(420).find((b) => b.cycles === 4).adequate ? 1 : 0, 0);
  t('sleep debt counts only shortfalls',
    V.study.sleepDebt([{ date: V.today(), hours: 6 }, { date: V.addDays(V.today(), -1), hours: 10 }], 8), 2);

  // =====================================================================
  group('Spaced repetition');
  const card = V.study.newReviewItem('s1', 'test');
  t('new card starts in box 0', card.box, 0);
  t('new card is due in 1 day', V.daysBetween(V.today(), card.dueDate), 1);
  // Grading is anchored to the later of today and the card's own due date, so these use
  // cards that are actually due — which is the case the intervals are specified for.
  const due = (box) => ({ box, dueDate: V.today(), reviews: 0, lapses: 0 });

  const passed = V.study.gradeReview(due(0), true);
  t('recall promotes to box 1', passed.box, 1);
  t('box 1 is due in 3 days', V.daysBetween(V.today(), passed.dueDate), 3);
  const box3 = V.study.gradeReview(due(2), true);
  t('three passes reach box 3', box3.box, 3);
  t('box 3 is due in 16 days', V.daysBetween(V.today(), box3.dueDate), 16);
  t('forgetting resets to box 0', V.study.gradeReview(box3, false).box, 0);
  t('a lapse is recorded', V.study.gradeReview(box3, false).lapses, 1);

  /*
   * Reviewing early must not compress the schedule.
   *
   * The flashcard decks let you study every card in a deck, not just the due ones, so this
   * is the normal path rather than an edge case. Scheduling from today would mean a card
   * comfortably 30 days out came back in 16 the moment you studied its deck, and the
   * expanding intervals the whole method depends on would collapse a little every session.
   */
  const early = { box: 2, dueDate: V.addDays(V.today(), 10), reviews: 5, lapses: 0 };
  t('reviewing early counts from the due date, not today',
    V.daysBetween(V.today(), V.study.gradeReview(early, true).dueDate), 26);
  t('reviewing early never shortens the interval',
    V.study.gradeReview(early, true).dueDate > early.dueDate, true);
  t('an overdue card still counts from today',
    V.daysBetween(V.today(),
      V.study.gradeReview({ box: 2, dueDate: V.addDays(V.today(), -9) }, true).dueDate), 16);
  t('a lapse rebuilds from today whatever the due date said',
    V.daysBetween(V.today(), V.study.gradeReview(early, false).dueDate), 1);
  t('only due cards are returned',
    V.study.dueItems([{ dueDate: V.today() }, { dueDate: V.addDays(V.today(), 5) }]).length, 1);
  t('re-reading is discounted vs recall',
    V.study.effectiveMinutes([{ minutes: 60, technique: 'reading' }]) <
    V.study.effectiveMinutes([{ minutes: 60, technique: 'recall' }]) ? 1 : 0, 1);

  // =====================================================================
  group('Strength rank');
  // 80 kg male: squat standards are 0.75 / 1.25 / 1.75 / 2.5 / 3.0 x bodyweight,
  // scoring 200 / 400 / 600 / 800 / 1000 at those exact thresholds.
  t('0.75x bodyweight = 200 (beginner)', V.rank.liftScore('ex-back-squat', 60, 80, 'male'), 200);
  t('1.25x = 400 (novice)', V.rank.liftScore('ex-back-squat', 100, 80, 'male'), 400);
  t('1.75x = 600 (intermediate)', V.rank.liftScore('ex-back-squat', 140, 80, 'male'), 600);
  t('2.5x = 800 (advanced)', V.rank.liftScore('ex-back-squat', 200, 80, 'male'), 800);
  t('3.0x = 1000 (elite)', V.rank.liftScore('ex-back-squat', 240, 80, 'male'), 1000);
  // 120 kg is 1.5x bodyweight — halfway between novice (1.25x = 400) and
  // intermediate (1.75x = 600), so it interpolates to 500.
  t('midpoint interpolates', V.rank.liftScore('ex-back-squat', 120, 80, 'male'), 500);
  t('deadlift 2.0x = 600', V.rank.liftScore('ex-deadlift', 160, 80, 'male'), 600);
  t('female standards scale by 0.72',
    V.rank.liftScore('ex-back-squat', 140 * 0.72, 80, 'female'), 600);
  t('unrated exercise returns null',
    V.rank.liftScore('ex-lateral-raise', 20, 80, 'male') === null ? 1 : 0, 1);

  t('one lift is capped by the breadth penalty', V.rank.overall([{ score: 800 }]), Math.round(800 * 0.82));
  t('three lifts score in full', V.rank.overall([{ score: 800 }, { score: 800 }, { score: 800 }]), 800);
  t('only the best three count',
    V.rank.overall([{ score: 900 }, { score: 900 }, { score: 900 }, { score: 100 }]), 900);
  t('no lifts means unranked', V.rank.overall([]) === null ? 1 : 0, 1);

  // Tiers are pinned to the strength standards: Adept = intermediate (600),
  // Master = advanced (860), Legend = elite (1000) across the best three lifts.
  t('rating 0 is Novice', V.rank.tierFor(0).name === 'Novice' ? 1 : 0, 1);
  t('intermediate (600) is Adept', V.rank.tierFor(600).name === 'Adept' ? 1 : 0, 1);
  t('995 is Grandmaster, not Legend', V.rank.tierFor(995).name === 'Grandmaster' ? 1 : 0, 1);
  t('Legend requires elite (1000)', V.rank.tierFor(1000).name === 'Legend' ? 1 : 0, 1);
  t('tiers ascend monotonically',
    V.rank.TIERS.every((x, i, a) => i === 0 || x.min > a[i - 1].min) ? 1 : 0, 1);
  t('progress reports points to next rank', V.rank.progress(200).pointsToNext, 50);
  t('XP level rises with XP', V.rank.levelFor(5000).level > V.rank.levelFor(500).level ? 1 : 0, 1);
  t('zero XP is level 1', V.rank.levelFor(0).level, 1);

  // =====================================================================
  group('XP weighting (load over volume)');
  const BW = 80;
  // Sets taken at 85% of the 1RM implied by each standard, for 4 reps.
  const setAt = (mult) => {
    const oneRM = mult * BW;
    return { completed: true, type: 'working', weightKg: oneRM * 0.85, reps: 4 };
  };
  const xpAt = (mult) => V.rank.setXp(setAt(mult), 'ex-back-squat', BW, 'male');

  t('a warmup earns nothing',
    V.rank.setXp({ completed: true, type: 'warmup', weightKg: 200, reps: 5 }, 'ex-back-squat', BW, 'male'), 0);
  t('an uncompleted set earns nothing',
    V.rank.setXp({ completed: false, type: 'working', weightKg: 200, reps: 5 }, 'ex-back-squat', BW, 'male'), 0);
  t('flat rate is small', V.rank.XP.perWorkingSet, 2);
  t('unrated lifts earn only the flat rate',
    V.rank.setXp(setAt(1.75), 'ex-lateral-raise', BW, 'male'), V.rank.XP.perWorkingSet);

  t('heavier sets earn strictly more', xpAt(2.5) > xpAt(1.75) ? 1 : 0, 1);
  t('and more again at elite', xpAt(3.0) > xpAt(2.5) ? 1 : 0, 1);
  // The whole point of the rebalance: load must dominate volume.
  t('one elite set beats four beginner sets', xpAt(3.0) > 4 * xpAt(0.75) ? 1 : 0, 1);
  t('elite set is worth 5x+ a beginner set', xpAt(3.0) / xpAt(0.75) >= 5 ? 1 : 0, 1);
  t('a PR is worth more than any single set', V.rank.XP.perPR > xpAt(3.0) ? 1 : 0, 1);

  // Twenty easy sets vs five heavy ones — the behaviour being discouraged.
  t('20 easy sets do not out-earn 5 heavy ones',
    20 * xpAt(0.75) < 5 * xpAt(2.5) ? 1 : 0, 1);

  // =====================================================================
  group('Map projection');
  // At zoom 0 the world is one 256px tile, so (0,0) lands dead centre.
  t('origin at zoom 0 is x=128', V.map.project(0, 0, 0).x, 128);
  t('origin at zoom 0 is y=128', V.map.project(0, 0, 0).y, 128);
  t('project/unproject round-trips (lat)', V.map.unproject(V.map.project(51.5, -0.12, 15).x, V.map.project(51.5, -0.12, 15).y, 15).lat, 51.5, 0.0001);
  t('project/unproject round-trips (lon)', V.map.unproject(V.map.project(51.5, -0.12, 15).x, V.map.project(51.5, -0.12, 15).y, 15).lon, -0.12, 0.0001);
  t('London to Paris is ~344 km', V.map.distance(51.5074, -0.1278, 48.8566, 2.3522) / 1000, 344, 2);
  t('a point is zero distance from itself', V.map.distance(51.5, -0.12, 51.5, -0.12), 0);

  // =====================================================================
  group('Content integrity');
  // Every id referenced by a meal or program must exist in the seed libraries.
  // A typo here silently breaks a feature at runtime — exactly how 'ex-farmers-walk'
  // (the real slug is 'ex-farmer-s-walk') got shipped once.
  const seedFoodIds = new Set(V.seedFoods().map((f) => f.id));
  const seedExIds = new Set(V.seedExercises().map((e) => e.id));

  const badIngredients = [];
  for (const m of V.MEALS) {
    for (const ing of m.ingredients) {
      if (!seedFoodIds.has(ing.foodId)) badIngredients.push(m.name + ' → ' + ing.foodId);
    }
  }
  t('every meal ingredient resolves', badIngredients.length, 0);
  if (badIngredients.length) {
    out.appendChild(Object.assign(document.createElement('div'),
      { className: 'case fail', textContent: badIngredients.join(' | ') }));
  }

  const badExercises = [];
  for (const p of V.PROGRAMS) {
    for (const d of p.days) {
      for (const s of d.exercises) {
        if (!seedExIds.has(s.exerciseId)) badExercises.push(p.name + '/' + d.name + ' → ' + s.exerciseId);
      }
    }
  }
  t('every program exercise resolves', badExercises.length, 0);
  if (badExercises.length) {
    out.appendChild(Object.assign(document.createElement('div'),
      { className: 'case fail', textContent: badExercises.join(' | ') }));
  }

  t('no duplicate food ids', seedFoodIds.size, V.seedFoods().length);
  t('no duplicate exercise ids', seedExIds.size, V.seedExercises().length);
  t('every meal has at least one step', V.MEALS.every((m) => m.steps.length > 0) ? 1 : 0, 1);
  t('every program has days', V.PROGRAMS.every((p) => p.days.length > 0) ? 1 : 0, 1);
  t('rep ranges are sane',
    V.PROGRAMS.every((p) => p.days.every((d) => d.exercises.every((e) => e.repMin <= e.repMax))) ? 1 : 0, 1);

  // =====================================================================
  group('Meal planning');
  const foodMap = {};
  for (const f of V.seedFoods()) foodMap[f.id] = f;
  const testMeal = V.MEALS.find((m) => m.id === 'meal-chicken-rice-broccoli');
  const mealNut = V.plan.mealNutrients(testMeal, foodMap);
  // 170g cooked chicken (165 kcal/100g) = 280.5, plus rice/broccoli/oil
  t('meal nutrients are computed, not hard-coded', mealNut.kcal > 400 && mealNut.kcal < 900 ? 1 : 0, 1);
  t('meal protein is substantial', mealNut.protein > 50 ? 1 : 0, 1);

  const shopping = V.plan.shoppingList([{ meal: testMeal, servings: 4 }], foodMap);
  t('shopping list has one row per ingredient', shopping.length, testMeal.ingredients.length);
  // 170 g x 4 servings = 680 g, rounded up to the next 50 g.
  // Compared as a string, so it goes through a boolean rather than the numeric helper.
  t('quantities round up to buyable amounts',
    shopping.find((i) => /Chicken breast, cooked/.test(i.name)).display === '700 g' ? 1 : 0, 1);
  t('duplicate ingredients across meals are merged',
    V.plan.shoppingList([{ meal: testMeal, servings: 1 }, { meal: testMeal, servings: 1 }], foodMap).length,
    testMeal.ingredients.length);
  t('time filter excludes slow meals',
    V.plan.filterMeals(V.MEALS, { maxMinutes: 10 }).every((m) => m.timeMin <= 10) ? 1 : 0, 1);

  // =====================================================================
  group('Insights statistics');
  const perfect = [];
  const doubled = [];
  for (let i = 0; i < 12; i++) {
    const d = V.addDays('2026-01-01', i);
    perfect.push({ date: d, value: i });
    doubled.push({ date: d, value: i * 2 });
  }
  t('perfect positive correlation', V.insights.correlate(perfect, doubled, 0).r, 1);

  const inverted = perfect.map((p) => ({ date: p.date, value: -p.value }));
  t('perfect negative correlation', V.insights.correlate(perfect, inverted, 0).r, -1);

  t('constant series has no correlation',
    V.insights.correlate(perfect, perfect.map((p) => ({ date: p.date, value: 5 })), 0) === null ? 1 : 0, 1);

  t('12 paired days is reportable', V.insights.correlate(perfect, doubled, 0).reportable ? 1 : 0, 1);
  t('5 paired days is NOT reportable',
    V.insights.correlate(perfect.slice(0, 5), doubled.slice(0, 5), 0).reportable ? 1 : 0, 0);

  // Lag 1 shifts series A forward a day, so a same-day-only relationship weakens.
  t('lag shifts the alignment',
    V.insights.align(perfect, doubled, 1).length, 11);
  t('lag 0 aligns every day', V.insights.align(perfect, doubled, 0).length, 12);

  t('strength labels: 0.8 is strong', V.insights.strength(0.8) === 'strong' ? 1 : 0, 1);
  t('strength labels: 0.2 is negligible', V.insights.strength(0.2) === 'negligible' ? 1 : 0, 1);
  t('p-value shrinks as r grows',
    V.insights.pValue(0.9, 20) < V.insights.pValue(0.3, 20) ? 1 : 0, 1);
  t('only curated questions are tested', V.insights.QUESTIONS.length < 20 ? 1 : 0, 1);

  // =====================================================================
  group('Flashcards — card shape');

  t('front is stored', c1.front === 'photosynthesis' ? 1 : 0, 1);
  t('back is stored', c1.back === 'light into chemical energy' ? 1 : 0, 1);
  t('title mirrors front for old backups', c1.title === c1.front ? 1 : 0, 1);
  t('a two-sided card needs no answer', c1.needsAnswer ? 1 : 0, 0);
  t('a one-sided card is flagged', V.study.newCard({ front: 'x' }).needsAnswer ? 1 : 0, 1);
  t('new cards start in box 0', c1.box, 0);
  t('new cards are due tomorrow', V.daysBetween(V.today(), c1.dueDate), 1);
  t('whitespace is trimmed', V.study.newCard({ front: '  a  ', back: '  b  ' }).front === 'a' ? 1 : 0, 1);
  t('legacy newReviewItem still works', V.study.newReviewItem('s1', 'term').front === 'term' ? 1 : 0, 1);

  // =====================================================================
  group('Flashcards — answer checking');
  const norm = V.study.normaliseAnswer;
  t('case is ignored', norm('Mitochondrion') === norm('mitochondrion') ? 1 : 0, 1);
  t('punctuation is ignored', norm('cell, wall.') === norm('cell wall') ? 1 : 0, 1);
  t('articles are ignored', norm('the nucleus') === norm('nucleus') ? 1 : 0, 1);
  t('accents are folded', norm('résumé') === norm('resume') ? 1 : 0, 1);
  // Deliberately not "a b" — "a" is an article and is stripped, which is correct.
  t('extra whitespace collapses', norm('  cell   wall  ') === 'cell wall' ? 1 : 0, 1);
  t('articles really are stripped', norm('a cell') === 'cell' ? 1 : 0, 1);

  const ck = V.study.checkAnswer;
  t('exact answer is correct', ck('nucleus', 'nucleus').correct ? 1 : 0, 1);
  t('different case is correct', ck('NUCLEUS', 'nucleus').correct ? 1 : 0, 1);
  t('with an article is correct', ck('the nucleus', 'nucleus').correct ? 1 : 0, 1);
  t('a genuine miss is wrong', ck('ribosome', 'nucleus').correct ? 1 : 0, 0);
  t('a genuine miss is not a near miss', ck('ribosome', 'nucleus').nearMiss ? 1 : 0, 0);
  // One transposed letter in a 12-character answer should not reset the card to box 0.
  t('a single typo is a near miss', ck('mitochondrin', 'mitochondrion').nearMiss ? 1 : 0, 1);
  t('a near miss is not counted correct', ck('mitochondrin', 'mitochondrion').correct ? 1 : 0, 0);
  // Short answers get no tolerance — one letter is proportionally a huge error.
  t('short answers tolerate nothing', ck('cat', 'bat').nearMiss ? 1 : 0, 0);
  t('empty input is flagged', ck('', 'nucleus').empty ? 1 : 0, 1);
  t('slash alternatives are accepted', ck('renal organ', 'kidney / renal organ').correct ? 1 : 0, 1);
  t('edit distance is symmetric',
    V.study.editDistance('abc', 'abd') === V.study.editDistance('abd', 'abc') ? 1 : 0, 1);
  t('edit distance of identical strings is 0', V.study.editDistance('abc', 'abc'), 0);

  // =====================================================================
  group('Flashcards — quiz construction');
  const deck = [
    V.study.newCard({ front: 'a', back: 'alpha' }),
    V.study.newCard({ front: 'b', back: 'beta' }),
    V.study.newCard({ front: 'c', back: 'gamma' }),
    V.study.newCard({ front: 'd', back: 'delta' }),
  ];
  const distr = V.study.distractors(deck[0], deck, 3);
  t('returns the requested number', distr.length, 3);
  t('never includes the correct answer',
    distr.some((d) => V.study.normaliseAnswer(d) === V.study.normaliseAnswer(deck[0].back)) ? 1 : 0, 0);
  t('distractors are unique', new Set(distr).size, distr.length);
  // A deck with duplicate backs must not offer the same wrong answer twice.
  const dupDeck = deck.concat([V.study.newCard({ front: 'e', back: 'beta' })]);
  t('duplicate backs are deduplicated',
    new Set(V.study.distractors(dupDeck[0], dupDeck, 3)).size,
    V.study.distractors(dupDeck[0], dupDeck, 3).length);
  t('cannot build choice from too few cards',
    V.study.canMultipleChoice(deck.slice(0, 2)) ? 1 : 0, 0);
  t('can build choice from four cards', V.study.canMultipleChoice(deck) ? 1 : 0, 1);

  const src = [1, 2, 3, 4, 5];
  const shuffled = V.study.shuffle(src);
  // Compared as strings, so these go through a boolean rather than the numeric helper.
  t('shuffle keeps every element',
    shuffled.slice().sort().join() === src.join() ? 1 : 0, 1);
  t('shuffle does not mutate the input', src.join() === '1,2,3,4,5' ? 1 : 0, 1);
  t('shuffle returns a new array', V.study.shuffle(src) === src ? 1 : 0, 0);

  // =====================================================================
  group('Flashcards — bulk import');
  const dash = V.study.parseBulk('photosynthesis - light to energy\nmitosis - cell division');
  t('dash separator parses two rows', dash.rows.length, 2);
  t('front is captured', dash.rows[0].front === 'photosynthesis' ? 1 : 0, 1);
  t('back is captured', dash.rows[0].back === 'light to energy' ? 1 : 0, 1);
  t('tab separator works', V.study.parseBulk('a\tb').rows.length, 1);
  t('colon separator works', V.study.parseBulk('a: b').rows.length, 1);
  t('blank lines are ignored', V.study.parseBulk('a - b\n\n\nc - d').rows.length, 2);
  t('unsplittable lines are reported', V.study.parseBulk('just one side').skipped.length, 1);
  t('unsplittable lines are not imported', V.study.parseBulk('just one side').rows.length, 0);
  t('export round-trips',
    V.study.parseBulk(V.study.toBulkText([{ front: 'x', back: 'y' }])).rows[0].back === 'y' ? 1 : 0, 1);

  // =====================================================================
  group('Food parser — numbers');
  const pn = V.foodParser.parseNumber;
  t('plain integer', pn('200'), 200);
  t('decimal', pn('1.5'), 1.5);
  t('word "two"', pn('two'), 2);
  t('word "a" means one', pn('a'), 1);
  t('word "half"', pn('half'), 0.5);
  t('word "dozen"', pn('dozen'), 12);
  t('fraction 1/2', pn('1/2'), 0.5);
  t('fraction 3/4', pn('3/4'), 0.75);
  t('vulgar half', pn('½'), 0.5);
  t('mixed number', pn('1½'), 1.5);
  t('non-number returns null', pn('chicken') === null ? 1 : 0, 1);

  // =====================================================================
  group('Food parser — phrases');
  const pi = V.foodParser.parseItem;

  const a1 = pi('200g chicken breast');
  t('quantity first: qty', a1.qty, 200);
  t('quantity first: unit', a1.unit === 'g' ? 1 : 0, 1);
  t('quantity first: name', a1.name === 'chicken breast' ? 1 : 0, 1);

  // People write the weight after the food just as often.
  const a2 = pi('chicken breast 200g');
  t('quantity last: qty', a2.qty, 200);
  t('quantity last: name', a2.name === 'chicken breast' ? 1 : 0, 1);

  const a3 = pi('2 eggs');
  t('bare count: qty', a3.qty, 2);
  // "egg" is both a unit-ish noun and the food; stripping it would leave nothing, so it
  // must be treated as the food.
  t('bare count keeps the food name', a3.name.indexOf('egg') === 0 ? 1 : 0, 1);

  const a4 = pi('a banana');
  t('"a" is a quantity of one', a4.qty, 1);
  t('"a" leaves the food name intact', a4.name === 'banana' ? 1 : 0, 1);

  const a5 = pi('2 slices of wholemeal bread');
  t('serving unit is captured', a5.unit === 'slices' ? 1 : 0, 1);
  t('"of" is dropped as noise', a5.name === 'wholemeal bread' ? 1 : 0, 1);
  t('serving unit qty', a5.qty, 2);

  t('no quantity defaults to one', pi('banana').qty, 1);
  t('no quantity is flagged', pi('banana').hadExplicitQty ? 1 : 0, 0);
  t('explicit quantity is flagged', pi('2 bananas').hadExplicitQty ? 1 : 0, 1);
  t('empty phrase returns null', pi('   ') === null ? 1 : 0, 1);
  t('filler words are stripped',
    pi('about 100 g of chicken').name === 'chicken' ? 1 : 0, 1);

  group('Food parser — splitting');

  t('splits on "with"', si('toast with butter').length, 2);
  t('splits on newlines', si('a\nb').length, 2);
  t('collapses empty segments', si('a,,,b').length, 2);

  t('kg converts', portionOf({ qty: 1.5, unit: 'kg' }, plain).grams, 1500);
  t('ounces convert', portionOf({ qty: 4, unit: 'oz' }, plain).grams, 4 * 28.3495);
  t('pounds convert', portionOf({ qty: 1, unit: 'lb' }, plain).grams, 453.592);
  t('a measured weight is confident', portionOf({ qty: 200, unit: 'g' }, plain).confident ? 1 : 0, 1);

  t('serving unit uses the food\'s own serving', portionOf({ qty: 2, unit: 'slices' }, bread).grams, 72);
  t('and is confident', portionOf({ qty: 2, unit: 'slices' }, bread).confident ? 1 : 0, 1);

  t('unknown serving falls back', portionOf({ qty: 1, unit: 'slice' }, plain).grams, 30);
  t('fallback is NOT confident', portionOf({ qty: 1, unit: 'slice' }, plain).confident ? 1 : 0, 0);

  t('three blanks before Thursday the 1st', jan.indexOf(jan.find(Boolean)), 3);
  t('first real cell is the 1st', jan.find(Boolean) === '2026-01-01' ? 1 : 0, 1);
  t('last real cell is the 31st',
    jan.filter(Boolean)[jan.filter(Boolean).length - 1] === '2026-01-31' ? 1 : 0, 1);

  t('weekday labels start on Monday', V.timeline.weekdayLabels(1).join('') === 'MTWTFSS' ? 1 : 0, 1);
  t('weekday labels start on Sunday', V.timeline.weekdayLabels(0).join('') === 'SMTWTFS' ? 1 : 0, 1);

    dayIdx.push(dayPool.indexOf(DQ.questionFor('2026-03-' + String(d).padStart(2, '0'), 'standard')));
  }
  const daySteps = dayIdx.slice(1).map((v, i) => v - dayIdx[i]);
  t('consecutive days do not step by a fixed amount', new Set(daySteps).size > 3 ? 1 : 0, 1);
  t('20 days draw widely from the bank',
    new Set(dayIdx).size >= Math.min(6, dayPool.length) ? 1 : 0, 1);
  const stats = DQ.stats([
    { date: '2026-01-01', correct: true },
    { date: '2026-01-02', correct: true },
  ]);
  t('answered count', stats.answered, 2);
  t('correct count', stats.correct, 2);
  t('an unbroken run is the streak', stats.streak, 2);
  t('a wrong answer ends the streak', DQ.stats([
    { date: '2026-01-01', correct: true },
    { date: '2026-01-02', correct: false },
  ]).streak, 0);
  t('the streak counts only the most recent run', DQ.stats([
    { date: '2026-01-01', correct: false },
    { date: '2026-01-02', correct: true },
    { date: '2026-01-03', correct: true },
  ]).streak, 2);
  t('no answers means no streak', DQ.stats([]).streak, 0);

  // =====================================================================
  group('Scanned-page card parsing');
  const AV = V.aiVision;
  const pc = (s) => AV.parseCardsJson(s);

  t('reads a well-formed reply',
    pc('{"cards":[{"front":"Mitochondrion","back":"Site of ATP production"}]}').length, 1);
  t('keeps the front text verbatim',
    pc('{"cards":[{"front":"Mitochondrion","back":"ATP"}]}')[0].front === 'Mitochondrion' ? 1 : 0, 1);
  // A model that ignores "JSON only" and fences its reply must still be readable.
  t('survives a markdown fence',
    pc('```json\n{"cards":[{"front":"A","back":"B"}]}\n```').length, 1);
  t('survives prose around the JSON',
    pc('Here you go:\n{"cards":[{"front":"A","back":"B"}]}\nHope that helps.').length, 1);
  // Half a card is not a card, and a deck of blanks is worse than an error.
  t('drops a card with no back', pc('{"cards":[{"front":"A","back":""}]}').length, 0);
  t('drops a card with no front', pc('{"cards":[{"front":"  ","back":"B"}]}').length, 0);
  t('drops a card missing a field entirely', pc('{"cards":[{"front":"A"}]}').length, 0);
  t('keeps the good ones alongside the bad',
    pc('{"cards":[{"front":"A","back":"B"},{"front":"C","back":""},{"front":"D","back":"E"}]}').length, 2);
  // Models repeat themselves across pages covering the same ground.
  t('de-duplicates identical fronts',
    pc('{"cards":[{"front":"A","back":"B"},{"front":"A","back":"C"}]}').length, 1);
  t('de-duplication ignores case and spacing',
    pc('{"cards":[{"front":"What is ATP?","back":"x"},{"front":"what is   atp?","back":"y"}]}').length, 1);
  t('trims whitespace',
    pc('{"cards":[{"front":"  A  ","back":"  B  "}]}')[0].front === 'A' ? 1 : 0, 1);
  t('an empty array is a valid answer, not an error', pc('{"cards":[]}').length, 0);

  // A blurry page must not be able to produce an unbounded deck.
  const many = { cards: [] };
  for (let i = 0; i < 200; i++) many.cards.push({ front: 'q' + i, back: 'a' + i });
  t('caps the number of cards from one request',
    pc(JSON.stringify(many)).length, AV.MAX_CARDS_PER_REQUEST);

  const threw = (s) => { try { pc(s); return 0; } catch (e) { return 1; } };
  t('unparseable input throws rather than returning junk', threw('not json at all'), 1);
  t('the wrong shape throws', threw('{"result":"ok"}'), 1);
  t('a bare array throws', threw('[{"front":"A","back":"B"}]'), 1);

  // The prompt is the main defence against invented content, so assert it says so.
  t('the prompt forbids adding outside knowledge',
    /never add facts from your own knowledge/i.test(AV.DECK_PROMPT) ? 1 : 0, 1);
  t('the prompt forbids padding to a quota',
    /never pad to reach a number/i.test(AV.DECK_PROMPT) ? 1 : 0, 1);
  t('the prompt allows returning nothing',
    /return an empty\s+array/i.test(AV.DECK_PROMPT) ? 1 : 0, 1);

  // =====================================================================
  group('Calorie safety margin');
  const mProf = { sex: 'male', weightKg: 80, heightCm: 180, age: 30, activityLevel: 'moderate', goal: 'maintain' };
  // BMR 1780, TDEE 1780*1.55 = 2759, maintain x1.0.
  const fullTarget = D.calorieTarget(mProf);
  t('no margin leaves the target alone', fullTarget, Math.round(1780 * 1.55));
  t('10% aims 10% low',
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: 0.1 })),
    Math.round(1780 * 1.55 * 0.9));
  t('15% aims 15% low',
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: 0.15 })),
    Math.round(1780 * 1.55 * 0.85));
  t('the unadjusted target is still reportable',
    D.calorieTargetUnadjusted(Object.assign({}, mProf, { calorieMargin: 0.1 })), fullTarget);
  t('marginApplied reports the gap',
    D.marginApplied(Object.assign({}, mProf, { calorieMargin: 0.1 })).difference,
    fullTarget - Math.round(1780 * 1.55 * 0.9));
  // The floor is what makes the margin safe to offer at all.
  const smallCut = { sex: 'female', weightKg: 50, heightCm: 160, age: 25, activityLevel: 'sedentary', goal: 'cut', calorieMargin: 0.2 };
  t('the margin can never push below BMR',
    D.calorieTarget(smallCut) >= Math.round(D.bmr(smallCut)) ? 1 : 0, 1);
  t('and says when the floor absorbed it', D.marginApplied(smallCut).floored ? 1 : 0, 1);
  t('a margin beyond the cap is clamped',
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: 0.9 })),
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: D.MAX_CALORIE_MARGIN })));
  t('a negative margin cannot raise the target',
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: -0.5 })), fullTarget);
  t('macros follow the adjusted target',
    D.macroTargets(Object.assign({}, mProf, { calorieMargin: 0.1 })).kcal,
    D.calorieTarget(Object.assign({}, mProf, { calorieMargin: 0.1 })));
  // Protein is per-kg, so trimming calories must not quietly trim protein with them —
  // the deficit is where the higher intake matters most.
  t('the margin does not touch protein',
    D.macroTargets(Object.assign({}, mProf, { calorieMargin: 0.15 })).protein,
    D.macroTargets(mProf).protein);

  // =====================================================================
  group('Feature switches');
  const FT = V.features;
  const on = { features: { study: true, hearing: true, cut: true } };
  const off = { features: { study: false, hearing: false, cut: false } };

  t('an enabled feature reads as on', FT.enabled(on, 'study') ? 1 : 0, 1);
  t('a disabled feature reads as off', FT.enabled(off, 'study') ? 0 : 1, 1);
  // Failing open matters: a feature added after someone's settings were written must
  // appear for them, not silently vanish because their stored flags predate it.
  t('an unknown key falls back to its default',
    FT.enabled({ features: {} }, 'cut'), FT.DEFAULTS.cut ? 1 : 0);
  t('a key with no default at all still shows',
    FT.enabled({ features: {} }, 'somethingAddedLater') ? 1 : 0, 1);
  t('no settings at all shows defaults', FT.enabled({}, 'study') ? 1 : 0, 1);
  // Today is essential and must survive any attempt to switch it off.
  t('essential features cannot be disabled',
    FT.enabled({ features: { today: false } }, 'today') ? 1 : 0, 1);

  t('a disabled tab is hidden',
    FT.visibleTabs(off, ['today', 'study', 'settings']).includes('study') ? 0 : 1, 1);
  t('an enabled tab is shown',
    FT.visibleTabs(on, ['today', 'study', 'settings']).includes('study') ? 1 : 0, 1);
  // Settings owns no feature and is the only route back to the switches.
  t('settings is never hidden',
    FT.visibleTabs(off, ['today', 'study', 'settings']).includes('settings') ? 1 : 0, 1);
  t('today is never hidden',
    FT.visibleTabs(off, ['today', 'study', 'settings']).includes('today') ? 1 : 0, 1);

  const allPaths = ['./js/app.js?v=1', './js/data-foods.js?v=1', './js/data-daily.js?v=1', './js/map.js?v=1'];
  const noFood = { features: { nutrition: false, dailyQuestion: true, places: true } };
  t('a disabled feature\'s data file is not pre-cached',
    FT.precachePaths(noFood, allPaths).some(p => /data-foods/.test(p)) ? 0 : 1, 1);
  t('an enabled feature\'s data file still is',
    FT.precachePaths(noFood, allPaths).some(p => /data-daily/.test(p)) ? 1 : 0, 1);
  t('core files are never dropped',
    FT.precachePaths(noFood, allPaths).some(p => /app\.js/.test(p)) ? 1 : 0, 1);
  t('the skip list names the dropped file',
    FT.skippedPaths(noFood).includes('./js/data-foods.js') ? 1 : 0, 1);
  t('nothing is skipped when everything is on', FT.skippedPaths({ features: FT.normalise({}) }).length,
    FT.FEATURES.filter(f => f.heavy && !FT.DEFAULTS[f.key]).reduce((n, f) => n + f.heavy.length, 0));

  t('normalise forces essentials on', FT.normalise({ today: false }).today ? 1 : 0, 1);
  t('normalise keeps an explicit choice', FT.normalise({ cut: true }).cut ? 1 : 0, 1);
  t('normalise ignores unknown keys', 'nonsense' in FT.normalise({ nonsense: true }) ? 0 : 1, 1);
  t('every feature key has a default',
    FT.FEATURES.every(f => f.key in FT.DEFAULTS) ? 1 : 0, 1);
  t('every feature has a blurb',
    FT.FEATURES.every(f => (f.blurb || '').length > 15) ? 1 : 0, 1);
  t('feature keys are unique',
    new Set(FT.FEATURES.map(f => f.key)).size, FT.FEATURES.length);
  t('summary counts only optional features',
    FT.summary({ features: FT.normalise({}) }).total, FT.FEATURES.filter(f => !f.essential).length);

  // =====================================================================
  group('Temperature conversion');
  t('0 C is 32 F', V.cToDisplay(0, 'f'), 32);
  t('100 C is 212 F', V.cToDisplay(100, 'f'), 212);
  t('37 C is 98.6 F', V.cToDisplay(37, 'f'), 98.6);
  t('Celsius passes through unchanged', V.cToDisplay(21.5, 'c'), 21.5);
  t('conversion round-trips', V.displayToC(V.cToDisplay(36.6, 'f'), 'f'), 36.6, 0.0001);
  t('-40 is the same in both', V.cToDisplay(-40, 'f'), -40);

  // =====================================================================
  group('Provider detection');
  const AP = V.aiProviders;
  const which = (k) => { const p = AP.detect(k); return p ? p.id : 'none'; };

  t('a Google key is recognised', which('AIzaSyC1234567890abcdefghij') === 'google' ? 1 : 0, 1);
  t('an Anthropic key is recognised',
    which('sk-ant-api03-abcdefghijklmnop') === 'anthropic' ? 1 : 0, 1);
  // Surrounding whitespace comes free with copy and paste and must not break detection.
  t('padding is trimmed', which('  AIzaSyC1234567890abcdefghij  ') === 'google' ? 1 : 0, 1);
  // Guessing here would send the key to a company the user never chose.
  t('an unknown key is not guessed at', which('sk-proj-somethingelse') === 'none' ? 1 : 0, 1);
  t('an empty key detects nothing', AP.detect('') === null ? 1 : 0, 1);
  t('a truncated prefix is rejected', which('AIza') === 'none' ? 1 : 0, 1);
  t('every provider has a fallback model',
    AP.PROVIDERS.every((p) => typeof p.fallbackModel === 'string' && p.fallbackModel) ? 1 : 0, 1);
  // Every provider must state what it does with submitted data — the key screen prints it
  // verbatim, so an empty one would silently drop a privacy disclosure.
  t('every provider declares a data note',
    AP.PROVIDERS.every((p) => typeof p.dataNote === 'string' && p.dataNote.length > 30) ? 1 : 0, 1);
  t('the Google note still names the training risk',
    /train|improve their models/i.test(AP.byId('google').dataNote) ? 1 : 0, 1);
  t('every provider has a key hint to show',
    AP.PROVIDERS.every((p) => typeof p.keyHint === 'string' && p.keyHint) ? 1 : 0, 1);
  t('a default model is offered per key',
    AP.defaultModelFor('AIzaSyC1234567890abcdefghij') === 'gemini-2.5-flash' ? 1 : 0, 1);
  t('an unknown key gets no default model',
    AP.defaultModelFor('nonsense') === null ? 1 : 0, 1);

  group('Provider request shaping');
  const G = AP.byId('google');
  const AN = AP.byId('anthropic');
  const shot = { base64: 'AAA', mimeType: 'image/png' };

  // Google takes the key in its own header; Anthropic needs a version and the header that
  // permits a browser to call it at all. A missing one of these is a silent failure.
  t('Google authenticates with x-goog-api-key',
    G.headers('k')['x-goog-api-key'] === 'k' ? 1 : 0, 1);
  t('Anthropic authenticates with x-api-key',
    AN.headers('k')['x-api-key'] === 'k' ? 1 : 0, 1);
  t('Anthropic pins an API version',
    AN.headers('k')['anthropic-version'] === '2023-06-01' ? 1 : 0, 1);
  t('Anthropic opts in to direct browser access',
    AN.headers('k')['anthropic-dangerous-direct-browser-access'] === 'true' ? 1 : 0, 1);
  // The key must never reach the URL — addresses end up in proxy and browser logs.
  t('the Google endpoint carries no key',
    /AIza|key=/.test(G.endpoint('gemini-2.5-flash')) ? 0 : 1, 1);
  t('the Anthropic endpoint carries no key', /key/.test(AN.endpoint('claude-opus-5')) ? 0 : 1, 1);

  const gBody = G.body({ system: 'S', text: 'Q', images: [shot], maxTokens: 100, temperature: 0.2 });
  const aBody = AN.body({ model: 'm', system: 'S', text: 'Q', images: [shot], maxTokens: 100, temperature: 0.2, effort: 'low' });

  t('Google nests the system prompt', gBody.systemInstruction.parts[0].text === 'S' ? 1 : 0, 1);
  t('Anthropic keeps system at the top level', aBody.system === 'S' ? 1 : 0, 1);
  t('Google sends the image first', gBody.contents[0].parts[0].inline_data.data === 'AAA' ? 1 : 0, 1);
  t('Anthropic wraps the image in a source block',
    aBody.messages[0].content[0].source.data === 'AAA' ? 1 : 0, 1);
  t('Google carries the mime type', gBody.contents[0].parts[0].inline_data.mime_type === 'image/png' ? 1 : 0, 1);
  t('Anthropic calls it media_type', aBody.messages[0].content[0].source.media_type === 'image/png' ? 1 : 0, 1);
  t('the question follows the image on Google', gBody.contents[0].parts[1].text === 'Q' ? 1 : 0, 1);
  t('the question follows the image on Anthropic',
    aBody.messages[0].content[1].text === 'Q' ? 1 : 0, 1);
  t('Google gets the token cap it understands', gBody.generationConfig.maxOutputTokens, 100);
  t('Anthropic gets the token cap it understands', aBody.max_tokens, 100);
  // Current Claude models reject sampling parameters with a 400, so temperature must be
  // dropped for them even though the caller passes the same value to both.
  t('Google accepts temperature', gBody.generationConfig.temperature, 0.2);
  t('Anthropic is sent no temperature', aBody.temperature === undefined ? 1 : 0, 1);
  t('Anthropic gets effort instead', aBody.output_config.effort === 'low' ? 1 : 0, 1);
  t('Google is sent no effort', gBody.generationConfig.effort === undefined ? 1 : 0, 1);

  // Multi-turn: the coach replays a conversation, and the two name their own turns
  // differently. Getting this wrong makes the model answer as if it were the user.
  const convo = [{ role: 'user', content: 'hi' }, { role: 'assistant', content: 'hello' }, { role: 'user', content: 'more' }];
  const gChat = G.body({ messages: convo, maxTokens: 10 });
  const aChat = AN.body({ model: 'm', messages: convo, maxTokens: 10 });
  t('Google relabels assistant turns as model', gChat.contents[1].role === 'model' ? 1 : 0, 1);
  t('Anthropic keeps them as assistant', aChat.messages[1].role === 'assistant' ? 1 : 0, 1);
  t('every turn survives on Google', gChat.contents.length, 3);
  t('every turn survives on Anthropic', aChat.messages.length, 3);
  t('no empty trailing turn is appended',
    gChat.contents[gChat.contents.length - 1].parts[0].text === 'more' ? 1 : 0, 1);

  // One schema is written by the caller; each provider gets the flavour it validates.
  const schema = { type: 'object', properties: { cards: { type: 'array', items: { type: 'object', properties: { front: { type: 'string' } }, required: ['front'] } } }, required: ['cards'] };
  const gJson = G.body({ text: 'x', maxTokens: 10, jsonSchema: schema });
  const aJson = AN.body({ model: 'm', text: 'x', maxTokens: 10, jsonSchema: schema });
  t('Google is told to reply as JSON',
    gJson.generationConfig.responseMimeType === 'application/json' ? 1 : 0, 1);
  t('Google gets the schema verbatim',
    gJson.generationConfig.responseSchema.additionalProperties === undefined ? 1 : 0, 1);
  t('Anthropic gets a json_schema format',
    aJson.output_config.format.type === 'json_schema' ? 1 : 0, 1);
  t('Anthropic objects are closed',
    aJson.output_config.format.schema.additionalProperties === false ? 1 : 0, 1);
  t('nested objects are closed too',
    aJson.output_config.format.schema.properties.cards.items.additionalProperties === false ? 1 : 0, 1);
  t('tightening does not mutate the original',
    schema.additionalProperties === undefined ? 1 : 0, 1);
  t('required lists survive tightening',
    aJson.output_config.format.schema.required[0] === 'cards' ? 1 : 0, 1);

  group('Provider response reading');
  t('Google text is joined from parts',
    G.parse({ candidates: [{ content: { parts: [{ text: 'a' }, { text: 'b' }] } }] }).text === 'ab' ? 1 : 0, 1);
  t('Anthropic text is joined from blocks',
    AN.parse({ content: [{ type: 'text', text: 'a' }, { type: 'text', text: 'b' }] }).text === 'ab' ? 1 : 0, 1);
  // Thinking blocks are not the answer and must not be concatenated into it.
  t('non-text blocks are ignored',
    AN.parse({ content: [{ type: 'thinking', thinking: 'hmm' }, { type: 'text', text: 'a' }] }).text === 'a' ? 1 : 0, 1);
  t('a safety stop is reported as blocked',
    G.parse({ candidates: [{ finishReason: 'SAFETY' }] }).stop === 'blocked' ? 1 : 0, 1);
  // A refusal is an HTTP 200 with empty or partial content — checked before reading it,
  // or it surfaces as the meaningless "reply came back empty".
  t('an Anthropic refusal is reported as blocked',
    AN.parse({ stop_reason: 'refusal', content: [] }).stop === 'blocked' ? 1 : 0, 1);
  t('truncation is reported as truncated',
    G.parse({ candidates: [{ finishReason: 'MAX_TOKENS' }] }).stop === 'truncated' ? 1 : 0, 1);
  t('Anthropic truncation too',
    AN.parse({ stop_reason: 'max_tokens', content: [{ type: 'text', text: 'half' }] }).stop === 'truncated' ? 1 : 0, 1);
  t('an empty reply is reported as empty',
    G.parse({ candidates: [{ content: { parts: [] } }] }).stop === 'empty' ? 1 : 0, 1);
  t('a missing candidate does not throw', G.parse({}).stop === 'empty' ? 1 : 0, 1);
  t('a null response does not throw', AN.parse(null).stop === 'empty' ? 1 : 0, 1);

  group('Provider error messages');
  const kind = (status, msg) => AP.normaliseError(status, { error: { message: msg } }, G).kind;
  const says = (status, msg) => AP.normaliseError(status, { error: { message: msg } }, G).message;

  t('401 is an auth problem', kind(401, 'nope') === 'auth' ? 1 : 0, 1);
  t('403 is an auth problem', kind(403, 'nope') === 'auth' ? 1 : 0, 1);
  t('a 400 about the key is an auth problem',
    kind(400, 'API key not valid. Please pass a valid API key.') === 'auth' ? 1 : 0, 1);
  t('a 400 about anything else is not', kind(400, 'bad image') === 'unknown' ? 1 : 0, 1);
  t('404 points at the model picker', kind(404, 'not found') === 'model' ? 1 : 0, 1);
  t('500 is the provider\'s problem', kind(503, 'overloaded') === 'server' ? 1 : 0, 1);
  // The 429 split: same status, opposite advice. Telling someone whose daily quota is gone
  // to "try again shortly" sends them into a retry loop for hours.
  t('a per-minute 429 is a rate limit',
    kind(429, 'Too many requests per minute') === 'rate' ? 1 : 0, 1);
  t('a per-day 429 is a spent quota',
    kind(429, 'Quota exceeded for quota metric requests per day') === 'quota' ? 1 : 0, 1);
  t('a rate limit says to wait', /wait a moment/i.test(says(429, 'per minute')) ? 1 : 0, 1);
  t('a spent quota says tomorrow',
    /tomorrow/i.test(says(429, 'requests per day exceeded')) ? 1 : 0, 1);
  t('a spent quota does not tell you to retry now',
    /try again/i.test(says(429, 'requests per day exceeded')) ? 0 : 1, 1);
  t('the offending provider is named',
    /Google/.test(says(500, '')) ? 1 : 0, 1);
  t('errors carry a machine-readable kind',
    typeof AP.normaliseError(429, null, G).kind === 'string' ? 1 : 0, 1);
  t('a missing body does not throw', AP.normaliseError(500, null, null).kind === 'server' ? 1 : 0, 1);

  group('Features needing a key');
  const FF = V.features.FEATURES;
  const keyed = FF.filter((f) => f.needsKey).map((f) => f.key);
  // These two do nothing until the user brings a key, so the first-run chooser leaves them
  // out. Everything else must stay in it.
  t('the coach is flagged as needing a key', keyed.includes('coach') ? 1 : 0, 1);
  t('photo-to-flashcards is too', keyed.includes('scanDeck') ? 1 : 0, 1);
  t('photo problem help is too', keyed.includes('photoHelp') ? 1 : 0, 1);
  t('nothing else is', keyed.length, 3);
  t('all of them are off by default',
    keyed.every((k) => V.features.DEFAULTS[k] === false) ? 1 : 0, 1);
  // Every AI feature must have a switch. One used to render on the Study tab with no
  // feature key at all, so switching the AI off did not remove it.
  t('every keyed feature has a default entry',
    keyed.every((k) => k in V.features.DEFAULTS) ? 1 : 0, 1);
  // enabled() falls back to DEFAULTS for keys absent from stored settings, so a feature
  // added in a later version stays off for people upgrading rather than appearing.
  t('a new keyed feature is off for existing users',
    V.features.enabled({ features: { study: true } }, 'photoHelp') ? 0 : 1, 1);
  // The chooser filters on this flag; a keyed feature that is also essential could never
  // be hidden, and would put an unusable switch on the first screen.
  t('no keyed feature is essential', FF.some((f) => f.needsKey && f.essential) ? 0 : 1, 1);
  t('hiding them still leaves a real list',
    FF.filter((f) => !f.essential && !f.needsKey).length > 5 ? 1 : 0, 1);
  // Settings shows every switch, so the unfiltered list must still contain them.
  t('they remain in the full list', FF.length - keyed.length < FF.length ? 1 : 0, 1);

  // =====================================================================
  group('Boxing off a region');
  const NBR = V.notebook;
  const rect = (a,b,c,d) => NBR.normaliseRect(a,b,c,d);

  // Dragging up-and-left is as natural as down-and-right and yields negative extents.
  t('a down-right drag keeps its corner', rect(10,10,50,40).x, 10);
  t('an up-left drag is flipped', rect(50,40,10,10).x, 10);
  t('width is always positive', rect(50,40,10,10).w, 40);
  t('height is always positive', rect(50,40,10,10).h, 30);
  t('both drags describe the same box',
    JSON.stringify(rect(10,10,50,40)) === JSON.stringify(rect(50,40,10,10)) ? 1 : 0, 1);
  // A click that moved three pixels is not a selection.
  t('a tiny box is unusable', NBR.isUsableRect(rect(0,0,5,5)) ? 0 : 1, 1);
  t('a real box is usable', NBR.isUsableRect(rect(0,0,200,120)) ? 1 : 0, 1);
  t('a thin sliver is unusable', NBR.isUsableRect(rect(0,0,300,4)) ? 0 : 1, 1);
  t('null is unusable', NBR.isUsableRect(null) ? 0 : 1, 1);
  t('padding grows every side', NBR.padRect({x:100,y:100,w:50,h:50}, 10).x, 90);
  t('padding adds twice to the size', NBR.padRect({x:100,y:100,w:50,h:50}, 10).w, 70);

  const inside  = { pts: [20,20, 30,30], color:'#000', width:2 };
  const outside = { pts: [500,500, 520,520], color:'#000', width:2 };
  // Overlapping, not contained: the tail of an equals sign poking out of the box must not
  // cause the whole stroke to be dropped from the image.
  const straddling = { pts: [40,40, 200,40], color:'#000', width:2 };
  const box = { x:0, y:0, w:100, h:100 };

  t('a stroke inside is included', NBR.strokesInRect([inside], box).length, 1);
  t('a stroke outside is not', NBR.strokesInRect([outside], box).length, 0);
  t('a stroke crossing the edge is included', NBR.strokesInRect([straddling], box).length, 1);
  t('only the relevant strokes come back',
    NBR.strokesInRect([inside, outside, straddling], box).length, 2);
  t('no box means no strokes', NBR.strokesInRect([inside], null).length, 0);
  t('an empty board is handled', NBR.strokesInRect([], box).length, 0);

  group('Remembered variables');
  const mv = NBR.mergeVariables;
  t('a new variable is kept', mv([], [{name:'x',value:'5'}]).length, 1);
  t('existing ones survive',
    mv([{name:'x',value:'5'}], [{name:'y',value:'2'}]).length, 2);
  // Redefining further down the board is the student changing their mind, not a conflict.
  t('a redefinition wins',
    mv([{name:'x',value:'5'}], [{name:'x',value:'9'}])[0].value === '9' ? 1 : 0, 1);
  t('a redefinition does not duplicate',
    mv([{name:'x',value:'5'}], [{name:'x',value:'9'}]).length, 1);
  t('first-seen order is stable',
    mv([{name:'a',value:'1'},{name:'b',value:'2'}], [{name:'a',value:'3'}])[0].name === 'a' ? 1 : 0, 1);
  t('a nameless entry is dropped', mv([], [{name:'',value:'5'}]).length, 0);
  t('a valueless entry is dropped', mv([], [{name:'x',value:''}]).length, 0);
  t('whitespace is trimmed', mv([], [{name:' x ',value:' 5 '}])[0].name === 'x' ? 1 : 0, 1);
  t('null inputs are survivable', mv(null, null).length, 0);
  // Over the cap the working end of the board is the relevant end.
  const manyVars = Array.from({length: 60}, (_, i) => ({name:'v'+i, value:String(i)}));
  t('the list is capped', mv([], manyVars).length, NBR.MAX_VARIABLES);
  t('the newest survive the cap',
    mv([], manyVars)[NBR.MAX_VARIABLES-1].name === 'v59' ? 1 : 0, 1);
  t('forgetting removes one',
    NBR.forgetVariable([{name:'x',value:'1'},{name:'y',value:'2'}], 'x').length, 1);
  t('forgetting keeps the others',
    NBR.forgetVariable([{name:'x',value:'1'},{name:'y',value:'2'}], 'x')[0].name === 'y' ? 1 : 0, 1);

  group('Whiteboard help replies');
  const ph = AV.parseBoardHelp;
  const pv = AV.parseBoardVariables;
  const reply = '{"help":"Try isolating x first.","variables":[{"name":"x","value":"5"}]}';

  t('the help text is read', ph(reply) === 'Try isolating x first.' ? 1 : 0, 1);
  t('variables are read', pv(reply).length, 1);
  t('the value comes through', pv(reply)[0].value === '5' ? 1 : 0, 1);
  t('a markdown fence survives', ph('```json\n' + reply + '\n```') === 'Try isolating x first.' ? 1 : 0, 1);
  // A schema is a strong constraint, not a guarantee — a prose reply must still show.
  t('plain prose falls back to itself',
    ph('Just try isolating x.') === 'Just try isolating x.' ? 1 : 0, 1);
  t('prose yields no variables', pv('Just try isolating x.').length, 0);
  t('an empty variable list is fine', pv('{"help":"hi","variables":[]}').length, 0);
  t('a half variable is dropped', pv('{"help":"h","variables":[{"name":"x"}]}').length, 0);
  t('a nameless variable is dropped', pv('{"help":"h","variables":[{"name":"","value":"5"}]}').length, 0);
  t('duplicates are collapsed',
    pv('{"help":"h","variables":[{"name":"x","value":"1"},{"name":"x","value":"2"}]}').length, 1);
  t('an absurdly long name is dropped',
    pv('{"help":"h","variables":[{"name":"' + 'z'.repeat(40) + '","value":"5"}]}').length, 0);
  t('units are preserved',
    pv('{"help":"h","variables":[{"name":"v","value":"3 m/s"}]}')[0].value === '3 m/s' ? 1 : 0, 1);

  group('Tutoring prompt');
  const rules = AV.TUTOR_RULES;
  // The prompt used to say "work through it step by step" and "state the final answer
  // clearly at the end" — a homework machine. These assertions pin the reversal.
  t('it forbids stating the answer', /NEVER state the final answer/.test(rules) ? 1 : 0, 1);
  t('it forbids working to completion', /NEVER work the problem to completion/.test(rules) ? 1 : 0, 1);
  t('it gives one step, not the chain', /ONE next step/.test(rules) ? 1 : 0, 1);
  t('it holds when asked directly', /ask you to just give the answer/.test(rules) ? 1 : 0, 1);
  t('it no longer promises a final answer',
    /State the final answer clearly/.test(rules) ? 0 : 1, 1);
  t('the photo helper uses these rules', AV.SYSTEM_PROMPT.indexOf(rules) > -1 ? 1 : 0, 1);
  t('the whiteboard helper uses them too', AV.BOARD_PROMPT.indexOf(rules) > -1 ? 1 : 0, 1);
  t('only the whiteboard one reads variables',
    /variable definitions/.test(AV.BOARD_PROMPT) && !/variable definitions/.test(AV.SYSTEM_PROMPT) ? 1 : 0, 1);

  group('Answer-leak detector');
  const leak = AV.looksLikeFinalAnswer;
  // Explicit declarations — the phrasings a model reaches for once it has decided to hand
  // the result over.
  t('"the answer is" is caught', leak('So the answer is 42.') ? 1 : 0, 1);
  t('"the final answer is" is caught', leak('The final answer is x = 3.') ? 1 : 0, 1);
  t('"therefore the solution" is caught', leak('Therefore the solution is 7.') ? 1 : 0, 1);
  t('"in conclusion" is caught', leak('In conclusion, the value is 9.') ? 1 : 0, 1);
  t('case does not matter', leak('THE ANSWER IS 5') ? 1 : 0, 1);

  /*
   * False positives matter more than misses. The warning sits above a reply the student
   * asked for, so crying wolf on correct tutoring trains them to ignore it — and the lines
   * below are exactly what correct tutoring output looks like. A detector that fires on
   * these is worse than no detector.
   */
  t('a bare equation is not a leak', leak('Start by writing 2x + 3 = 11.') ? 0 : 1, 1);
  t('an intermediate step is not a leak',
    leak('Subtract 3 from both sides to get 2x = 8.') ? 0 : 1, 1);
  t('naming a method is not a leak',
    leak('This one calls for the quadratic formula.') ? 0 : 1, 1);
  t('a question back is not a leak',
    leak('What do you get if you divide both sides by 2?') ? 0 : 1, 1);
  t('mentioning the word answer is not a leak',
    leak('Once you have an answer, check it by substituting back.') ? 0 : 1, 1);
  t('"answer that yourself" is not a leak',
    leak('Try to answer that step yourself first.') ? 0 : 1, 1);
  t('empty text is not a leak', leak('') ? 0 : 1, 1);
  t('null is survivable', leak(null) ? 0 : 1, 1);


  // =====================================================================
  group('Encrypted backup');
  /*
   * This path had no coverage at all, and was broken.
   *
   * b64() was `btoa(String.fromCharCode.apply(null, bytes))`, which spreads every byte into
   * an argument list — capped around 65k arguments in JavaScriptCore and 125k in V8. Any
   * real database threw RangeError, and because the plain-text export does not go through
   * that helper, the failure quietly steered people towards the UNENCRYPTED file. The size
   * used below is chosen to sit well past both limits, so this test fails on the old code.
   */
  if (!V.backup.available()) {
    t('crypto unavailable — served over http:// rather than localhost?', 0, 1);
  } else {
    const pass12 = 'correct-horse-battery';

    // ~1.5 MB of JSON: comfortably past both argument limits.
    const big = { version: 1, exportedAt: new Date().toISOString(), stores: {
      foodLogs: Array.from({ length: 6000 }, (_, i) => ({
        id: 'f' + i, date: '2026-01-01', meal: 'lunch', note: 'a portion of something',
        nutrients: { kcal: 500 + i, protein: 30, carbs: 60, fat: 20 },
      })),
    } };
    const bigJson = JSON.stringify(big).length;
    t('the fixture is past the argument limit', bigJson > 400000 ? 1 : 0, 1);

    const env = await V.backup.encrypt(big, pass12);
    t('a large payload encrypts at all', env && env.data ? 1 : 0, 1);
    t('the envelope names its cipher', env.cipher.name === 'AES-GCM' ? 1 : 0, 1);
    t('the envelope records its iteration count', env.kdf.iterations, 600000);
    t('iterations meet the SHA-256 recommendation', env.kdf.iterations >= 600000 ? 1 : 0, 1);
    t('salt and iv are not reused across exports',
      (await V.backup.encrypt(big, pass12)).kdf.salt !== env.kdf.salt ? 1 : 0, 1);

    const back = await V.backup.decrypt(env, pass12);
    t('a large payload round-trips intact', JSON.stringify(back).length, bigJson);
    t('the rows survive', back.stores.foodLogs.length, 6000);
    t('the last row survives unchanged', back.stores.foodLogs[5999].nutrients.kcal, 6499);

    let rejected = 0;
    try { await V.backup.decrypt(env, 'the-wrong-passphrase'); } catch (e) { rejected = 1; }
    t('the wrong passphrase is refused', rejected, 1);

    // AES-GCM authenticates, so a flipped byte must fail rather than decrypt to rubbish.
    const tampered = Object.assign({}, env, {
      data: env.data.slice(0, 40) + (env.data[40] === 'A' ? 'B' : 'A') + env.data.slice(41),
    });
    let caught = 0;
    try { await V.backup.decrypt(tampered, pass12); } catch (e) { caught = 1; }
    t('a tampered payload is refused', caught, 1);

    let short = 0;
    try { await V.backup.encrypt({ stores: {} }, 'short'); } catch (e) { short = 1; }
    t('a passphrase under 12 characters is refused', short, 1);
  }


  // =====================================================================
  group('The study-photo wall holds');
  /*
   * view-solve.js tells the user that no health data reaches the photo-help feature and
   * that this is "enforced in code, not just policy". Until this test existed, it was not:
   * it was enforced by an unusually disciplined module boundary and a loud comment, either
   * of which a later edit could quietly step over while passing review and every test.
   *
   * So the boundary is now checked mechanically. ai-vision.js may touch exactly one thing
   * in storage — the API key it needs to make a request at all — and nothing else. Adding
   * `question: buildContext()` to a prompt in that file now fails here.
   *
   * Read from source rather than by instrumenting the module, because the claim being made
   * is about what the file is allowed to contain, not about what one code path happened to
   * do on one run.
   */
  const visionSrc = await fetch('js/ai-vision.js?v=38').then((r) => r.text());

  // Every store access in the file, e.g. `V.store.db.get(` or `V.store.foodLogs.all(`.
  const storeCalls = visionSrc.match(/V\.store\.[A-Za-z.]+/g) || [];
  const nonDb = storeCalls.filter((c) => !c.startsWith('V.store.db.'));
  t('ai-vision touches no repository except the kv primitives', nonDb.length, 0);

  // Every key it reads or writes. Only the API key is permitted.
  const keys = (visionSrc.match(/V\.store\.db\.\w+\(\s*'(\w+)'\s*,\s*\{?\s*'?(\w+)'?/g) || [])
    .map((m) => m.replace(/[\s\S]*'(\w+)'\s*,\s*\{?\s*'?(\w+)'?/, '$1/$2'));
  const forbidden = keys.filter((k) => k !== 'kv/visionKey' && k !== 'kv/key');
  t('ai-vision reads and writes only kv/visionKey', forbidden.length, 0);
  t('it does reach the key, so the check is not vacuous',
    keys.includes('kv/visionKey') ? 1 : 0, 1);

  // The health-data summary builder must not be reachable from the vision module.
  t('ai-vision never calls the coach context builder',
    /buildContext|V\.gaps|V\.insights|V\.domain\./.test(visionSrc) ? 1 : 0, 0);

  // =====================================================================
  const summary = document.createElement('div');
  summary.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
  summary.textContent = fail === 0
    ? `All ${pass} assertions passed.`
    : `${fail} of ${pass + fail} assertions FAILED.`;
  out.insertBefore(summary, out.firstChild);
})();
</script>
</body>
</html>
