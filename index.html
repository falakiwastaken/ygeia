<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ygeia</title>
<meta name="description" content="Free, open-source, offline-first lifestyle tracker. Nutrition, lifting, sport, sleep and study. Your data never leaves your device.">
<meta name="theme-color" content="#F6F2E8">

<!--
  Content-Security-Policy.

  script-src is 'self' and nothing else. No CDN, no third-party code, no import() at
  runtime — every line that executes here came from this repository. Ygeia briefly shipped
  an optional on-device model that pulled a runtime from a CDN; that code ran in this origin
  with full IndexedDB access and could not be pinned with an integrity hash, so removing it
  removed the only way untrusted code could ever reach your data.

  connect-src then enumerates every host anything on this page may talk to, so even a
  cross-site scripting bug has nowhere to send what it reads.

  If you add a network call, add its host here or it will silently fail.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://tile.openstreetmap.org;
  font-src 'self';
  worker-src 'self' blob:;
  connect-src 'self' blob:
    https://world.openfoodfacts.org
    https://overpass-api.de
    https://nominatim.openstreetmap.org
    https://generativelanguage.googleapis.com
    https://raw.githubusercontent.com;
  base-uri 'self';
  form-action 'none';
  object-src 'none';
">

<!-- iOS home-screen install: launches fullscreen with no Safari chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ygeia">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/app.css?v=18">
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="header-row">
      <button class="icon-btn" id="btn-prev-day" aria-label="Previous day">‹</button>
      <button class="date-btn" id="btn-date">
        <span class="date-main" id="date-main">Today</span>
        <span class="date-sub" id="date-sub"></span>
      </button>
      <button class="icon-btn" id="btn-next-day" aria-label="Next day">›</button>
    </div>
  </header>

  <main id="views">
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-food"></section>
    <section class="view" id="view-train"></section>
    <section class="view" id="view-study"></section>
    <section class="view" id="view-body"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today">
      <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="food">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10"/><path d="M17 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM17 12v9"/></svg>
      <span>Food</span>
    </button>
    <button class="tab" data-view="train">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>
      <span>Train</span>
    </button>
    <button class="tab" data-view="study">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      <span>Study</span>
    </button>
    <button class="tab" data-view="body">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M3 12h4l2-6 3 13 3-9 2 2h4"/></svg>
      <span>Body</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" id="sheet-close" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Local passcode lock. Covers everything until unlocked. -->
  <div id="lock-screen" hidden></div>
</div>

<!--
  Classic scripts, loaded in dependency order and sharing the window.V namespace.

  Deliberately NOT ES modules: <script type="module"> is blocked by CORS on file:// URLs,
  and this app must run by opening index.html with no server and no build step.
-->
<script src="js/util.js?v=18"></script>

<script src="js/view-study.js?v=18"></script>

<script src="js/view-settings.js?v=18"></script>
<script src="js/app.js?v=18"></script>
</body>
</html>
